# The reading order, in two levels.
#
# Nothing is used before it has been explained, so this is a dependency order
# rather than an importance order.
#
# The idea that binds it — that reaching data is an act of declared work — is
# introduced up front rather than by putting the Work section first. Leading
# with Work would have led with the one subject that has no surface to
# demonstrate yet, so the introduction supplies the frame and Work goes where
# its vocabulary has something concrete to attach to. Files stay flat
# in this directory and the grouping lives here: a chapter's published address
# does not change because it moved sections.
#
# The sample world is not here on purpose. It exists so the examples in these
# chapters are consistent with each other and stay that way; that is a fact
# about how this documentation is kept, not something a reader of it needs.
