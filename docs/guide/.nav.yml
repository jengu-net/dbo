# The reading order, in three parts.
#
# The chapters are the user stories, in the order the stories README lists
# them, because that is their dependency order: a clinic is opened before care
# is recorded in it, and care is recorded before anybody asks what was kept
# about them. Each chapter follows its story's scene with the story's own
# people, and quotes the code that walks it in the sample applications.
#
# Stories told from an operator's side are one page, "Running it", because the
# reader here is the developer of an application, and an operator's chapter
# would be the same links with more words around them.
#
# The reference pages are concepts no single scene owns. They are short on
# purpose: the chapters teach, and these are where a word is looked up.
#
# Files stay flat in this directory and the grouping lives here, so a
# chapter's published address does not change because it moved sections.
nav:
  - index.md
  - quick-start.md
  - The stories:
      - a-tenant-opens.md
      - care-is-recorded.md
      - what-a-person-can-ask-for.md
      - one-tenant-in-two-places.md
      - the-standard-moves.md
      - work-leaves-and-comes-back.md
      - a-step-for-every-tenant.md
      - on-the-stream.md
  - running-it.md
