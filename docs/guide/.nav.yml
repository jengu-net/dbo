# The reading order, in two levels.
#
# Work comes first, and that is the one place the dependency order is broken on
# purpose. Everything here is built around work — what may be reached, by whom,
# and why — so a reader who meets records, tenants and faces before meeting
# work learns the parts without the thing that binds them. The work chapters
# introduce the vocabulary; the sections after them supply the mechanics.
#
# After that the principle holds: nothing is used before it has been explained,
# so the order is a dependency order rather than an importance order. Files stay flat
# in this directory and the grouping lives here: a chapter's published address
# does not change because it moved sections.
#
# The sample world is not here on purpose. It exists so the examples in these
# chapters are consistent with each other and stay that way; that is a fact
# about how this documentation is kept, not something a reader of it needs.
