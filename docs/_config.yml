# The documentation site is this folder, rendered. Two trees under it are
# deliberately not part of that site.
#
# `tasks/` is the live agenda: documents that carry a topic between its issues
# and its concepts, and that are deleted when those issues close. `plans/` is
# what is proposed rather than what is. Both stay readable in the repository,
# where a reader can see they are working documents — rendered beside the
# specification they would read as part of it, which is the opposite of what
# they are.
#
# The consequence, and the reason this comment is longer than the setting: a
# page that IS published must not reach either tree with a relative link. Such
# a link resolves in the repository and 404s on the site, so the few that need
# to point there use an absolute repository URL instead.
exclude:
  - tasks
  - plans
