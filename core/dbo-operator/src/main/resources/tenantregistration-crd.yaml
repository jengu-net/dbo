apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenantregistrations.jengu.cloud
spec:
  group: jengu.cloud
  names:
    kind: TenantRegistration
    plural: tenantregistrations
    singular: tenantregistration
    shortNames: [treg]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [code, fhirVersion, types]
              properties:
                code:
                  type: string
                  pattern: '^[a-z][a-z0-9_]{0,15}$'
                fhirVersion:
                  type: string
                  enum: [r4, r5]
                deletionPolicy:
                  type: string
                  enum: [Retain, Delete]
                  default: Retain
                types:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name, identity]
                    properties:
                      name:
                        type: string
                      identity:
                        type: string
                        enum: [identifier, canonical, internal]
                      systems:
                        type: array
                        items:
                          type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: FHIR
          type: string
          jsonPath: .spec.fhirVersion
