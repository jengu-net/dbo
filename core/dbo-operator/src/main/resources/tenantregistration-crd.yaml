apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenantregistrations.dbo.jengu.cloud
spec:
  group: dbo.jengu.cloud
  names:
    kind: TenantRegistration
    plural: tenantregistrations
    singular: tenantregistration
    shortNames: [treg]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [code, face, types]
              properties:
                code:
                  type: string
                  pattern: '^[a-z][a-z0-9_]{0,15}$'
                # The face this tenant is served through. Not an enum: which
                # faces exist is decided by what a deployment installs, and a
                # closed list here refuses a face the container can serve —
                # including one that is not a FHIR version at all. The pattern
                # keeps it a name; bring-up answers whether anything serves it.
                face:
                  type: string
                  pattern: '^[a-z][a-z0-9-]{0,31}$'
                # Which jurisdiction this tenant is a member of. Naming one
                # does not make it one: the named tenant says so itself.
                zone:
                  type: string
                # This tenant IS a jurisdiction. Members name it, its brokers
                # and terminology are its records, and it is declared here
                # rather than inferred from who points at it.
                zoneRoot:
                  type: boolean
                # What a zone permits its members to do for each other, by
                # process. A child zone may only narrow its parent's, and a
                # zone that lists none permits none.
                exchanges:
                  type: array
                  items:
                    type: string
                # The provider this tenant is a partner of: it is reached only
                # through that provider, on credentials the provider issues.
                partnerOf:
                  type: string
                # What kind of tenant it is: a label to select it by. dbo.
                # kinds are the store's own; any other name is free.
                kind:
                  type: string
                # What wraps the tenant's working key, when not the
                # deployment's own key: a Transit key in the deployment's
                # Vault, or in one its owner runs.
                workingKey:
                  type: object
                  required: [key]
                  properties:
                    key:
                      type: string
                    vault:
                      type: string
                    mount:
                      type: string
                    auth:
                      type: object
                      properties:
                        mount:
                          type: string
                        role:
                          type: string
                # Where the tenant's owner keeps its configuration: a git
                # repository on a path the deployment can read, and the ref
                # applied when the tenant comes up.
                configuration:
                  type: object
                  required: [git]
                  properties:
                    git:
                      type: string
                    ref:
                      type: string
                    # The Transit key its secrets are wrapped by, when not
                    # tenant-<code>.
                    key:
                      type: string
                broker:
                  type: string
                acceptedBrokers:
                  type: array
                  items:
                    type: string
                dependencies:
                  type: array
                  items:
                    type: object
                    required: [name, types]
                    properties:
                      name:
                        type: string
                      types:
                        type: array
                        items:
                          type: string
                      # The face chain, which the parser reads and this did
                      # not declare. An undeclared key is PRUNED rather than
                      # refused, so the tenant registered and came up without
                      # the dependency it names being its face — the quiet
                      # half of the failure the top-level check catches loudly.
                      face:
                        type: boolean
                deletionPolicy:
                  type: string
                  enum: [Retain, Delete]
                  default: Retain
                pdi:
                  type: boolean
                audit:
                  type: object
                  properties:
                    level:
                      type: string
                      enum: [none, writes, full]
                writeDiscipline:
                  type: object
                  properties:
                    default:
                      type: string
                      enum: [standard, append-only]
                    perType:
                      type: object
                      additionalProperties:
                        type: string
                        enum: [standard, append-only]
                retention:
                  type: object
                  properties:
                    perType:
                      type: object
                      additionalProperties:
                        type: object
                        properties:
                          keepAtLeast:
                            type: string
                          removeAfter:
                            type: string
                # A tenant whose people are provisioned by an identity
                # provider names the system it accepts them from.
                scim:
                  type: object
                  properties:
                    system:
                      type: string
                # What this tenant can be asked to do, and over what. A slot
                # names a type the tenant holds; a run of the step is created
                # over the documents filling its slots and reaches no further.
                steps:
                  type: array
                  items:
                    type: object
                    required: [code, slots]
                    properties:
                      code:
                        type: string
                      slots:
                        type: object
                        additionalProperties:
                          type: string
                      # The types a result of this step may ask the tenant to
                      # write. Each is a type the tenant holds; a step naming
                      # none writes nothing.
                      writes:
                        type: array
                        items:
                          type: string
                      # Which of its failures automation is given again: the
                      # faults that pass (unreachable, lapsed), how long a
                      # task is held back, and how many times before a
                      # person is given it instead.
                      retry:
                        type: object
                        properties:
                          on:
                            type: array
                            items:
                              type: string
                              enum: [unreachable, lapsed]
                          after:
                            type: string
                          attempts:
                            type: integer
                            minimum: 1
                      # When automation may take a task of this step: a
                      # FHIRPath condition over the task's inputs, decided as
                      # the task is authored. Absent is always.
                      automate:
                        type: object
                        required: [when]
                        properties:
                          when:
                            type: string
                      # Who the application that asked for a run is, once the
                      # run's work is over: an audience under
                      # disclosure.perAudience, whose types and mode bound
                      # what it collects. Declared with collect, and neither
                      # alone.
                      answers:
                        type: string
                      # How long the asker may collect after the result is
                      # written, as an ISO-8601 duration.
                      collect:
                        type: string
                      # Why the step reads a person, as a PurposeOfUse code.
                      # Required where the audience reveals include; the
                      # collecting request states the same code.
                      purpose:
                        type: string
                      # When the step starts itself: exactly one of a
                      # calendar rule (every, six fields from seconds), a
                      # change to a record its search finds (change), or a
                      # moment a matching record names (due, with at and
                      # after). A calendar step says what a missed tick
                      # becomes; every one says how long its runs are kept
                      # and where it starts.
                      # For an exchange a zone declares, what the asker waits
                      # for: the records shared, sealed to its reader; how the
                      # work ended; or nothing once it is authored.
                      awaits:
                        type: string
                        enum: [records, outcome, none]
                      # The tenant's secrets a run of the step may reach, by
                      # name: a step reaches what it declares and nothing else.
                      secrets:
                        type: array
                        items:
                          type: string
                      # Whether a run of the step is work that lasts: opened
                      # for the one request its one slot names, held by
                      # nobody, moved and ended by the runs that are its parts.
                      lasts:
                        type: boolean
                      # Whether its work, which lasts, is handed to the service
                      # provider for the provider's people to carry out.
                      handsTo:
                        type: string
                        enum: [provider]
                      # The steps a person of the provider holding its work
                      # may start as parts of it.
                      holdersStart:
                        type: array
                        items:
                          type: string
                      starts:
                        type: object
                        required: [keep, where]
                        properties:
                          every:
                            type: string
                          change:
                            type: string
                          due:
                            type: string
                          at:
                            type: string
                          after:
                            type: string
                          missed:
                            type: string
                            enum: [once, skip]
                          keep:
                            type: string
                          where:
                            type: string
                            enum: [origin, places, everywhere]
                # Steps the DEPLOYMENT performs for every tenant that admits
                # them, declared in the management tenant's registration and
                # refused in anybody else's. Declared here all the same: the
                # management tenant is a tenant registration like any other,
                # and a key the API server does not know is not an invalid
                # field but a rejected registration — the whole tenant, not
                # the line.
                fleetSteps:
                  type: array
                  items:
                    type: object
                    required: [code, slots]
                    properties:
                      code:
                        type: string
                      # The types these name belong to the tenants whose work
                      # the step performs, not to the tenant declaring it.
                      slots:
                        type: object
                        additionalProperties:
                          type: string
                      # Which of those slots it OPENS rather than carries. A
                      # step that opens none is a router and discloses
                      # nothing; the register a tenant reads is generated from
                      # this list.
                      opens:
                        type: array
                        items:
                          type: string
                      # Whether a tenant may decline it. Required is an
                      # agreement signed by joining, and is said here so the
                      # set is enumerable and readable before anyone joins.
                      required:
                        type: boolean
                      # What happens to work whose processing a tenant has not
                      # yet approved. Absent is processed-and-named.
                      posture:
                        type: string
                        enum: [applied, processed-and-named, not-until-approved]
                      # Where this step's queue lives. Absent is the
                      # deployment's own; several steps may name one.
                      substrate:
                        type: string
                      # The partners the provider hands this step's work to;
                      # adding one widens the step's register row.
                      delegatesTo:
                        type: array
                        items:
                          type: string
                      # Whether a run of it in each tenant is work that lasts.
                      lasts:
                        type: boolean
                      # When it starts itself in each tenant admitting it, as
                      # a tenant's own step's starts says.
                      starts:
                        type: object
                        required: [keep, where]
                        properties:
                          every:
                            type: string
                          change:
                            type: string
                          due:
                            type: string
                          at:
                            type: string
                          after:
                            type: string
                          missed:
                            type: string
                            enum: [once, skip]
                          keep:
                            type: string
                          where:
                            type: string
                            enum: [origin, places, everywhere]
                # Steps the deployment performs that THIS tenant will not
                # have done to its data. Admitted by saying nothing, which is
                # the ordinary case; a step the deployment declares required
                # cannot be listed here and the declaration is refused if it
                # is.
                declines:
                  type: array
                  items:
                    type: string
                # Which rows of the register this tenant authorised, each by
                # its own digest. All at once and per row, which sound opposed
                # and are not: a tenant reads one register and writes down every
                # row of it in one act, and because the rows are named
                # individually the store can still say which single one is new
                # or widened. Empty means it has read none.
                authorised:
                  type: array
                  items:
                    type: string
                # Steps this tenant must have available before it serves.
                mandatorySteps:
                  type: array
                  items:
                    type: string
                # The partner tenant that manages this one, where one does.
                managedBy:
                  type: string
                # A face root reads a version's packages and publishes them as
                # records; every other tenant subscribes to one.
                faceRoot:
                  type: boolean
                # Writes judged from the definition index rather than from a
                # loaded specification. Needs a face behind it, and needs its
                # StructureDefinition to be replicated: a tenant that authors
                # profiles has to snapshot them, and this face holds nothing
                # that can.
                indexFace:
                  type: boolean
                # Which element of a type carries the organisation a record
                # belongs to, per type.
                organisations:
                  type: object
                  properties:
                    perType:
                      type: object
                      additionalProperties:
                        type: string
                # What an audience may be shown, per audience.
                disclosure:
                  type: object
                  properties:
                    perAudience:
                      type: object
                      additionalProperties:
                        type: object
                        properties:
                          types:
                            type: array
                            items:
                              type: string
                          reveals:
                            type: string
                types:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    # handling is required at the outermost boundary: an
                    # unclassified type is refused by the API server, so it
                    # never becomes a registration somebody has to debug at
                    # tenant bring-up
                    required: [name, identity, handling]
                    properties:
                      name:
                        type: string
                      identity:
                        type: string
                        enum: [identifier, canonical, internal]
                      definition:
                        description: >-
                          whether this face has a definition for the type.
                          Left out, it does; 'none' for a declaration of the
                          consumer's own, which FHIR cannot be given a
                          definition for — such a type is stored and returned
                          verbatim and is findable only by the identity it
                          declares.
                        type: string
                        enum: [by-the-face, none]
                      extractor:
                        description: >-
                          where this type's envelope is computed. Left out, in
                          this process by the face's own extractor; 'database'
                          to compute it where the bytes are, which a tenant
                          asks for only once the two have been compared over
                          what it holds.
                        type: string
                        enum: [in-process, database]
                      # What a write does with an element this type's
                      # definition does not declare: refused, or kept as it
                      # arrived and answerable by nothing.
                      unknown:
                        type: string
                        enum: ["refused", "kept"]
                      verdict:
                        description: >-
                          whose answer decides a write of this type. Left out,
                          the toolchain's, as it always has been; 'database'
                          for this store's own checks, which a tenant asks for
                          once the tally of what the two made of its writes
                          says they agree. It changes what is ACCEPTED, so it
                          is declared per type and never inferred.
                        type: string
                        enum: [toolchain, database]
                      handling:
                        type: string
                        enum: [operational, projected-config, mirrored,
                               replicated, store-authored, audit, ephemeral]
                      systems:
                        type: array
                        items:
                          type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Face
          type: string
          jsonPath: .spec.face
