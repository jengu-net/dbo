apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenantregistrations.dbo.jengu.cloud
spec:
  group: dbo.jengu.cloud
  names:
    kind: TenantRegistration
    plural: tenantregistrations
    singular: tenantregistration
    shortNames: [treg]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [code, fhirVersion, types]
              properties:
                code:
                  type: string
                  pattern: '^[a-z][a-z0-9_]{0,15}$'
                fhirVersion:
                  type: string
                  enum: [r4, r5, r6]
                zone:
                  type: string
                broker:
                  type: string
                acceptedBrokers:
                  type: array
                  items:
                    type: string
                dependencies:
                  type: array
                  items:
                    type: object
                    required: [name, types]
                    properties:
                      name:
                        type: string
                      types:
                        type: array
                        items:
                          type: string
                deletionPolicy:
                  type: string
                  enum: [Retain, Delete]
                  default: Retain
                pdi:
                  type: boolean
                audit:
                  type: object
                  properties:
                    level:
                      type: string
                      enum: [none, writes, full]
                writeDiscipline:
                  type: object
                  properties:
                    default:
                      type: string
                      enum: [standard, append-only]
                    perType:
                      type: object
                      additionalProperties:
                        type: string
                        enum: [standard, append-only]
                retention:
                  type: object
                  properties:
                    perType:
                      type: object
                      additionalProperties:
                        type: object
                        properties:
                          keepAtLeast:
                            type: string
                          removeAfter:
                            type: string
                types:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    # handling is required at the outermost edge: an
                    # unclassified type is refused by the API server, so it
                    # never becomes a registration somebody has to debug at
                    # tenant bring-up
                    required: [name, identity, handling]
                    properties:
                      name:
                        type: string
                      identity:
                        type: string
                        enum: [identifier, canonical, internal]
                      handling:
                        type: string
                        enum: [operational, projected-config, mirrored,
                               replicated, store-authored, audit, ephemeral]
                      systems:
                        type: array
                        items:
                          type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: FHIR
          type: string
          jsonPath: .spec.fhirVersion
