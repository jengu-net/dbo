# java.util.logging, for the bundles that use it — the ServiceLoader mediator
# among them. Their INFO chatter would otherwise print beside the JSON stream
# in a different format, which is worse than either format alone.
#
# WARNING, not OFF: a mediator that fails to register a provider is something
# an operator needs to see.
handlers = java.util.logging.ConsoleHandler
.level = WARNING
java.util.logging.ConsoleHandler.level = WARNING
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
