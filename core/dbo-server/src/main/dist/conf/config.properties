# Felix launcher configuration for the dbo serving distribution (dbo#19).
# Everything tenant-specific arrives as -D system properties from
# bin/dbo-server; BundleContext.getProperty falls back to them.
felix.auto.deploy.dir=bundle
felix.auto.deploy.action=install,start
# tmpdir, not a path under the dist: in the container WORKDIR /app is
# root-owned (COPY --chown covers only the copied tree), and the cache is
# ephemeral by design (storage.clean below).
org.osgi.framework.storage=${java.io.tmpdir}/dbo-felix-cache
org.osgi.framework.storage.clean=onFirstInit
