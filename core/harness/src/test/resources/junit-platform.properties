# The IT classes run CONCURRENTLY against one shared Postgres
# (SharedPostgres): each takes a database of its own, and the
# tenant-driving classes use class-unique tenant codes because tenant
# database names derive from them.
#
# Methods stay same-thread: several classes are @TestMethodOrder(Order)
# pipelines where step N reads what step N-1 wrote.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
# Each class runs its own Felix and/or HTTP server, so parallelism is
# bounded by memory rather than cores; 4 keeps a laptop comfortable.
junit.jupiter.execution.parallel.config.fixed.parallelism=4
