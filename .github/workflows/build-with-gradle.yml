# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted # Use self-hosted runner to avoid GitHub Actions billing
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Gradle - assemble
        run: ./gradlew :db-objects:assemble :db-objects-postgres:assemble :db-objects-micronaut:assemble
      - name: Publish packages
        run: ./gradlew :db-objects:publish :db-objects-postgres:publish :db-objects-micronaut:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
