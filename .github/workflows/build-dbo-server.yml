name: Build and Push dbo-server Image

# Same registry pattern as jengu-platform's build-jengu-runtime.yml
# (ADR 0024 there): the self-hosted runner builds natively and pushes to
# the LAN zot on the Synology; production pulls the same repository as
# repo.jengu.cloud/dbo-operator through the cluster's own ingress.
#
# The pull_request filter mirrors the push filter on purpose — a filter
# narrower than its push twin reports success by running nothing
# (see the incident note in build-jengu-runtime.yml).

on:
  push:
    branches:
      - main
    paths:
      - "core/dbo-server/**"
      - "core/dbo-tenant-k8s/**"
      - "core/dbo-tenant/**"
      - "core/dbo-core/**"
      - "core/dbo-postgres/**"
      - "core/dbo-terminology/**"
      - "core/dbo-subscriptions/**"
      - "core/dbo-fhir-common/**"
      - "core/dbo-fhir-r4/**"
      - "core/dbo-fhir-r5/**"
      - "core/dbo-rest/**"
      - "settings.gradle.kts"
      - ".github/workflows/build-dbo-server.yml"
  pull_request:
    branches:
      - main
    paths:
      - "core/dbo-server/**"
      - "core/dbo-tenant-k8s/**"
      - "core/dbo-tenant/**"
      - "core/dbo-core/**"
      - "core/dbo-postgres/**"
      - "core/dbo-terminology/**"
      - "core/dbo-subscriptions/**"
      - "core/dbo-fhir-common/**"
      - "core/dbo-fhir-r4/**"
      - "core/dbo-fhir-r5/**"
      - "core/dbo-rest/**"
      - "settings.gradle.kts"
      - ".github/workflows/build-dbo-server.yml"
  workflow_dispatch:

env:
  REGISTRY: 192.168.1.14:5050
  # No org prefix — repo.jengu.cloud/dbo-operator and this LAN address are
  # two routes to one zot repository, not two registries.
  IMAGE_NAME: dbo-server

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push:
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Persistent-runner daemon hygiene, same as the platform workflows.
      - name: Stop leftover Gradle daemons
        run: ./gradlew --stop || true

      - name: Build serving distribution
        # The standard Felix launcher + the production bundle set (bin/,
        # bundle/, conf/); the Dockerfile copies it whole. Architecture-
        # neutral, so buildx only assembles image layers — no cross-compile.
        run: ./gradlew :core:dbo-server:installDist --no-daemon

      # docker login is unusable against a plain-HTTP registry; buildkit
      # reads ~/.docker/config.json directly, so write that and leave the
      # daemon's configuration alone.
      - name: Authenticate to the LAN registry
        if: github.event_name != 'pull_request'
        env:
          REG_USER: ${{ secrets.NEXUS_USERNAME }}
          REG_PASS: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.docker
          AUTH=$(printf '%s:%s' "$REG_USER" "$REG_PASS" | base64 | tr -d '\n')
          printf '{"auths":{"%s":{"auth":"%s"}}}' "${{ env.REGISTRY }}" "$AUTH" > ~/.docker/config.json
          echo "credential written for ${{ env.REGISTRY }}"

      - name: Generate image tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAGS=""

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ]; then
            BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
            TAGS="$TAGS ${IMAGE}:${BRANCH_NAME}"
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAGS="$TAGS ${IMAGE}:pr-${{ github.event.pull_request.number }}"
          fi

          # Sanitised — pull_request runs have ref_name like "12/merge".
          SAFE_REF=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          TAGS="$TAGS ${IMAGE}:${SAFE_REF}-${{ github.sha }}"
          TAGS="$TAGS ${IMAGE}:build-${{ github.run_number }}"

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="$TAGS ${IMAGE}:latest"
          fi

          {
            echo "tags<<__TAGS_EOF__"
            for t in $TAGS; do echo "$t"; done
            echo "__TAGS_EOF__"
          } >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # buildkit defaults to HTTPS; scoped to the one LAN host.
          config-inline: |
            [registry."192.168.1.14:5050"]
              http = true

      - name: Build and push image (multi-arch amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: core/dbo-server
          file: core/dbo-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/jengu-net/dbo
            org.opencontainers.image.revision=${{ github.sha }}
