name: Publish dbo libraries

# Mirrors jengu-platform's build-and-publish.yml: every main push publishes
# the library modules as 0.1.0-SNAPSHOT to the self-hosted repository
# (repo.jengu.cloud — own storage, anonymous reads, no quota accountant).
# Consumers: the platform embeds dbo conditionally in local-dev, the edge
# runtimes permanently, both resolving these coordinates.
#
# Tests run in build.yml; this is assemble + publish only, so the publish
# path stays independent of the testcontainer environment. The pull_request
# trigger mirrors push so a PR that breaks assembly is caught here too.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A publish can fail for reasons unrelated to the commit (registry
  # briefly unreachable, credential rotation) — re-runnable on demand.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-publish:
    runs-on: self-hosted
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Stop leftover Gradle daemons
        run: ./gradlew --stop || true

      - name: Assemble
        run: ./gradlew assemble --no-daemon

      - name: Publish library modules
        if: github.event_name != 'pull_request'
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: ./gradlew publish --no-daemon
