name: build

# THE dbo pipeline — one workflow, two modes:
#
#   main push / PR   suite → (push only) snapshot jars → images :main-<sha>
#   release tag v*   suite → RELEASE jars → images :X.Y.Z
#                    → Maven Central bundle (v-tags only)
#
# Releases pin everything to one number: the jars, the Bundle-Versions and
# the image tags. Nothing publishes and no image ships unless the full suite
# is green on exactly that commit.
#
# Jars go to the project's own PUBLIC repository. Central is a later
# destination for the same coordinates, blocked on artifact size rather than
# on anything about the build (RELEASING.md).
#
# Maven Central is deliberately RELEASE-ONLY and gated on a secret being
# present: Central is immutable, so a publish is not something a main-branch
# push should be able to do by accident.
#
# Every job runs on GitHub-hosted runners. This repository ran on self-hosted
# runners while it was private, because hosted minutes are a monthly budget
# there; a public repository has no such budget, and a self-hosted runner
# reachable from a fork pull request is arbitrary code execution on the
# machine that runs it. Nothing here may say `self-hosted` again.
#
# THE ARTIFACT HOST IS OPTIONAL, and named by one repository variable:
# ARTIFACT_HOST, the host serving the Maven tree at /repository/. Unset, the
# jar publish is skipped rather than failed: a destination that does not
# exist is a known state, and a red X nobody can act on teaches people to
# ignore red Xs.
#
# It gates the JAR PUBLISH and nothing else. Images go to public registries
# only — the fleet's own registry was retired when this repository went
# public, because its images are public on GHCR and a public registry is a
# better home for them than a box somebody has to keep running. Anything
# that pointed at that registry now names ghcr.io directly.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Sized from what the job actually costs rather than from a round number:
    # the full suite ran between fifteen and thirty-six minutes on the
    # previous runners, so sixty is roughly twice the worst observed. Tight
    # enough that a hang is noticed while somebody is still awake, loose
    # enough that a slow-but-working run is not killed — which is the failure
    # mode that costs more, because a false red teaches people to re-run
    # without reading.
    timeout-minutes: 60
    # the test reporter writes a check run and annotates failing lines
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check branding
        # Branding creeps back one commit at a time, and a public repository
        # that quietly regrows private issue numbers and internal hostnames is
        # worse than one that never cleaned them.
        run: .github/scripts/check-branding.sh
      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "gradle_args=-Pdbo.version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "image_tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "gradle_args=" >> "$GITHUB_OUTPUT"
            echo "image_tag=main-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and test core
        # ./verify, not a gradlew line: the dials and the phase order live in
        # the repository (gradle.properties and ./verify), so a developer can
        # run THIS check rather than retype it out of a workflow file. Three
        # commits landed on a red main while a local build was green at twice
        # this heap and could not fail the way CI fails.
        run: ./verify ${{ steps.version.outputs.gradle_args }}
      # The results page LEADS with what the build means — the composed
      # promise report: which promises are proven, by which tests, and what
      # ground is still a gap (REQ-DBO-PRM-COVERAGE-ON-THE-RESULTS-PAGE).
      # A job summary is plain markdown; no report format is faked.
      - name: Promise coverage on the results page
        run: |
          ./gradlew :core:harness:promiseReport -q
          cat core/harness/build/reports/promise/report.md >> "$GITHUB_STEP_SUMMARY"
      # Gradle already writes JUnit XML; this step makes failures readable
      # WITHOUT scrolling the log (the CI-parity rule: verdicts, not logs).
      # It runs on failure too — that is the case worth reading. The method
      # listing is off: "did it test anything" is now answered above, by
      # promises PROVEN with their citing sites, which is the meaning of the
      # run rather than its inventory.
      #
      # A pull request from a fork runs with a read-only token, so the
      # reporter cannot create a check run there; it annotates the log
      # instead of failing on the permission it does not have.
      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: "**/build/test-results/**/TEST-*.xml"
          detailed_summary: false
          include_passed: false
          group_suite: true
          include_time_in_summary: true
          check_name: dbo suite
          annotate_only: ${{ github.event.pull_request.head.repo.fork == true }}
      - name: Upload HTML test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          retention-days: 7
    outputs:
      gradle_args: ${{ steps.version.outputs.gradle_args }}
      image_tag: ${{ steps.version.outputs.image_tag }}
      is_release: ${{ steps.version.outputs.is_release }}

  dependencies:
    # The dependency graph, submitted by a job rather than by GitHub's own
    # "Automatic Dependency Submission".
    #
    # Both mechanisms can be on at once and only one of them can work. This
    # job was removed and the automatic one enabled on 2026-09-07; three of
    # its runs then succeeded, said "successfully uploaded", and changed
    # nothing — the graph stayed on the snapshot THIS job last submitted, and
    # every Dependabot security update failed against packages that were no
    # longer there. A snapshot is superseded only by another under the same
    # correlator, which is the workflow and job name, so nothing but this job
    # can replace what this job wrote.
    #
    # Keep exactly one of the two. If the automatic one is ever preferred
    # again, this job has to run once more first, or its snapshot outlives it.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Minutes, not hours: it resolves a graph and posts it.
    timeout-minutes: 20
    # writing the snapshot to the dependency graph is a write, and the
    # repository's default token is read-only
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # After the suite rather than beside it: resolving every configuration
      # across a composite build is real work.
      - uses: gradle/actions/dependency-submission@v4

  quickstart:
    # The quickstart, actually run.
    #
    # It deliberately does NOT need the build. The compose file pins a
    # published image at an exact commit, because somebody who types no tag
    # should not receive an arbitrary one — so what this proves is that the
    # quickstart works, not that the current tree does. That is the check
    # that was missing: the instruction for getting a store running used to
    # be a one-line docker run on the landing page, it could not work for
    # three separate reasons, and nothing ever ran it.
    #
    # It is therefore also the job that fails when the pin needs moving, which
    # is the moment to move it rather than a year later.
    runs-on: ubuntu-latest
    # A cold start provisions two tenants, a database and a terminology
    # baseline each. Two minutes locally; ten is room for a slow runner
    # without letting a hang sit.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run the quickstart
        run: ./quickstart/check.sh

  site:
    # The published site, which is a BUILD OUTPUT and not a branch.
    #
    # `./gradlew site` assembles one tree from two — the hand-written pages in
    # site/ own the root, the specification in docs/ is mounted under /docs/ —
    # and renders it with mkdocs. What GitHub Pages used to serve was Jekyll
    # over docs/ alone, so the landing page, the essays and the header menu
    # existed in the repository and nowhere a reader could reach them.
    #
    # It deliberately does NOT need the build, for the same reason the
    # quickstart does not: what it renders is the tree at this commit, and
    # whether the Java suite is green does not change whether a cross
    # reference resolves. Gating it would mean a red suite silently freezes
    # the documentation at whatever it last said.
    #
    # `mkdocs build --strict` is the check: a broken § reference fails this
    # job. That is worth running on a pull request, where it can be fixed
    # before merge — so the job builds on every trigger and deploys on none
    # of them but a push to main.
    runs-on: ubuntu-latest
    # Two seconds of mkdocs behind a pip install into a fresh venv. Fifteen
    # is for the install and the network it needs, not for the render.
    timeout-minutes: 15
    # Stated rather than inherited. `pages: write` and `id-token: write` are
    # what the deploy needs and are the reason this job is worth reading
    # carefully: it is the only one here that can change what the world sees.
    permissions:
      contents: read
      pages: write
      id-token: write
    # Pages serves one deployment at a time. The workflow-level group is per
    # ref, which does not stop a tag build and a main build from arriving
    # together, and cancelling a half-finished deploy leaves the site on the
    # previous version rather than broken — so queue rather than cancel.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # The site's Python tools are pinned in site/requirements.txt and are
      # installed into a venv under build/, so this only has to provide the
      # interpreter that venv is made from.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site
        run: ./gradlew site
      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - name: Deploy to Pages
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4

  publish:
    needs: build
    # Never on pull_request, and never without a repository to publish to.
    if: github.event_name != 'pull_request' && vars.ARTIFACT_HOST != ''
    runs-on: ubuntu-latest
    # Assembles and uploads. The bound is about a network call that never
    # returns rather than about how long publishing takes.
    timeout-minutes: 30
    # Stated rather than inherited. An unstated block takes whatever the
    # repository default happens to be, which is a setting somebody can
    # change without reading this file; naming it pins what the job may do
    # to what the job actually does. This one only reads the tree — the
    # credentials it publishes with are secrets, not the workflow token.
    permissions:
      contents: read
    env:
      DBO_REPO_HOST: ${{ vars.ARTIFACT_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the artifacts to compare
        # assemble, not build: the suite already ran in the build job and
        # running it twice is what this whole change is about.
        run: ./gradlew assemble --no-daemon ${{ needs.build.outputs.gradle_args }}
      - name: Decide what actually changed
        id: changed
        run: |
          set -uo pipefail
          .github/scripts/modules-to-publish.sh > /tmp/publish-tasks.txt
          {
            echo "tasks<<EOF"
            cat /tmp/publish-tasks.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Publish the modules that changed
        # ~242MB went to the repository on every push, almost none of it
        # different: the FHIR stack alone is 88MB and moves a few times a
        # year. Only what differs from what the repository already serves is
        # uploaded now — a question that is answerable only because the jars
        # are reproducible. Every uncertainty publishes; see the script.
        if: steps.changed.outputs.tasks != ''
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          xargs ./gradlew --no-daemon ${{ needs.build.outputs.gradle_args }} \
            < /tmp/publish-tasks.txt

  images:
    needs: build
    # Never on pull_request: a fork's pull request must not be able to push
    # an image anywhere, and the token it runs with could not anyway. Kept
    # explicit rather than relied on, because the day it matters is the day
    # somebody added a secret.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Kept at forty: a two-architecture build under emulation is genuinely
    # slow, and this is the job that once hung on an unreachable registry —
    # where the bound is what eventually frees the queue.
    timeout-minutes: 40
    # ONE job for both images, not a matrix entry each. The matrix bought
    # nothing and cost twice: two Gradle bootstraps assembling the same
    # dependency graph, two QEMU installs, and a third job always waiting for
    # a slot. Both dists come out of one Gradle invocation now, and the two
    # image builds are steps.
    env:
      # GHCR is the primary and always exists: deployments can pull from it
      # by a public name. Docker Hub mirrors it because that is where people
      # look first, gated on its secret so a fork builds without any of them.
      # The fleet's own registry is the optional third, gated on the host
      # existing (see the top of this file).
      GHCR_OWNER: ghcr.io/jengu-net
      DOCKERHUB_OWNER: docker.io/jengu
      # Booleans, never the secret itself, and computed HERE because the
      # `secrets` context does not exist inside an `if:` — a workflow that
      # reaches for it there does not fail the job, it fails to parse, and
      # every push to the branch reports a run with no jobs at all.
      HAVE_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the distributions
        # One invocation: the dependency graph is configured and resolved
        # once for the set rather than once each.
        run: >-
          ./gradlew :core:dbo-operator:installDist :core:dbo-server:installDist :core:dbo-fleet:installDist
          --no-daemon ${{ needs.build.outputs.gradle_args }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: ${{ env.HAVE_DOCKERHUB == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # One build per image, every destination as a tag of that build, so the
      # tag rules of one registry cannot drift from another's by accident and
      # the layers are built once. `latest` moves on every main push on the
      # fleet registry, which is what makes its update path work; on the
      # public registries it follows RELEASES only, because somebody who
      # types no tag should not receive an arbitrary commit. amd64 stays in
      # the platform list: Hetzner production is amd64, so it has a consumer.
      - name: Build and push (multi-arch amd64 + arm64)
        run: |
          set -euo pipefail
          for image in dbo-operator dbo-server dbo-fleet; do
            tags=(--tag "${GHCR_OWNER}/${image}:${IMAGE_TAG}")
            if [ "$IS_RELEASE" = "true" ]; then
              tags+=(--tag "${GHCR_OWNER}/${image}:latest")
            fi
            if [ "$HAVE_DOCKERHUB" = "true" ]; then
              tags+=(--tag "${DOCKERHUB_OWNER}/${image}:${IMAGE_TAG}")
              if [ "$IS_RELEASE" = "true" ]; then
                tags+=(--tag "${DOCKERHUB_OWNER}/${image}:latest")
              fi
            fi
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --file "core/$image/Dockerfile" \
              "${tags[@]}" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.version=${IMAGE_TAG}" \
              --label "org.opencontainers.image.licenses=MIT" \
              --push "core/$image"
          done
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          IS_RELEASE: ${{ needs.build.outputs.is_release }}

  central:
    # Maven Central, release tags only. Immutable once accepted: the bundle is
    # uploaded and left in a validated state for a human to release from the
    # Central Portal, rather than auto-published.
    needs: build
    if: needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Stated rather than inherited, as in publish. Central is reached with a
    # token of its own, and upload-artifact writes through the Actions API
    # rather than the tree, so reading is all this needs.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Refuse to build a bundle without a signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_KEY is not set — Central rejects unsigned artifacts."
            echo "An unsigned bundle would fail validation after upload, which is a" >&2
            echo "worse place to find out. Set SIGNING_KEY and SIGNING_PASSWORD." >&2
            exit 1
          fi
      - name: Stage and bundle
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew centralBundle --no-daemon ${{ needs.build.outputs.gradle_args }}
      - name: Upload to the Central Portal
        env:
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CENTRAL_TOKEN" ]; then
            echo "::error::CENTRAL_TOKEN is not set."
            exit 1
          fi
          code=$(curl --silent --show-error --fail-with-body \
            --output /tmp/central-response.txt --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $CENTRAL_TOKEN" \
            --form "bundle=@build/central/dbo-central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=dbo-${GITHUB_REF_NAME}&publishingType=USER_MANAGED")
          echo "HTTP $code"
          cat /tmp/central-response.txt
          echo
          echo "Deployment staged. Validate and release it from" \
               "https://central.sonatype.com/publishing/deployments"
      - name: Keep the bundle as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-bundle
          path: build/central/dbo-central-bundle.zip
          retention-days: 14
