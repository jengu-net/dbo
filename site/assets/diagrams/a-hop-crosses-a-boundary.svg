    </g>
    <g class="lini-node lini-line" style="stroke: var(--lini-accent)" transform="translate(0,0)">
      <line x1="-4.8555" y1="-84.5" x2="-4.8555" y2="139.5"/>
    </g>
    <g class="lini-node lini-line" style="stroke: var(--lini-accent)" transform="translate(0,0)">
      <line x1="202.7575" y1="-84.5" x2="202.7575" y2="139.5"/>
