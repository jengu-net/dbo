      <g class="lini-node lini-path" style="fill: var(--lini-stroke); stroke: none; stroke-width: 0" transform="translate(0,0)">
        <path d="M 307.749 -13.5 L 316.92900000000003 -4.3199999999999985 L 307.749 -4.3199999999999985 Z"/>
      </g>
      <text class="lini-text" x="0" y="0" dy="0.358em">Three records, in three stores: the sender&apos;s egress, the receiver&apos;s ingress, the platform&apos;s coordination.</text>
