<svg xmlns="http://www.w3.org/2000/svg" viewBox="-435.88 -159.5 871.76 319" width="871.76" height="319" class="lini lini-scope-43aea669" role="img" aria-labelledby="a-hop-crosses-a-boundary-title a-hop-crosses-a-boundary-desc">
  <title id="a-hop-crosses-a-boundary-title">A hop crosses a boundary, and is recorded three times</title>
  <desc id="a-hop-crosses-a-boundary-desc">A process running in the platform plane asks the sending tenant to perform its half. The tenant does the work and sends the content directly to the receiving tenant's ingress, which takes it; only a reference goes back to the platform. The platform then records the hop itself: the participants, the process it belongs to and the hashes of what moved, never the content. Three records are written in three stores: the sender's egress and the receiver's ingress in each tenant's own trail, and the coordination in the platform's.</desc>
  <style>
    @layer lini.defaults {
      :root, .lini-scope-43aea669 { color-scheme: light dark; --lini-accent: #a8641b; --lini-accent-soft: #f6efe4; --lini-fg: light-dark(black, #e8e8ea); --lini-fill: light-dark(white, #26262b); --lini-font-weight: 500; --lini-link-font-weight: 400; --lini-seal: #14532d; --lini-seal-soft: #e7f0e9; --lini-stroke: #444444; --lini-text-color: var(--lini-fg); }
      .lini-scope-43aea669[data-theme="dark"], [data-theme="dark"] .lini-scope-43aea669 { color-scheme: dark; }
      .lini-scope-43aea669[data-theme="light"], [data-theme="light"] .lini-scope-43aea669 { color-scheme: light; }
    }
    .lini-scope-43aea669 { font-family: "Google Sans"; font-size: 13px; font-weight: var(--lini-font-weight); color: var(--lini-text-color); }
    .lini-scope-43aea669 .lini-block { fill: none; stroke: none; stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-43aea669 .lini-path { stroke-dasharray: none; }
    .lini-scope-43aea669 .lini-line { fill: none; stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-43aea669 .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-43aea669 .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-43aea669 .lini-note { fill: var(--lini-fill); stroke: var(--lini-stroke); }
    .lini-scope-43aea669 .lini-face { fill: var(--lini-accent-soft); stroke: var(--lini-accent); }
    .lini-scope-43aea669 .lini-engine { fill: var(--lini-seal-soft); stroke: var(--lini-seal); }
    .lini-scope-43aea669 .lini-link { fill: none; stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-43aea669 .lini-link-dashed { stroke-dasharray: 7,5.5; }
    .lini-scope-43aea669 .lini-sequence-message { fill: currentColor; stroke: none; text-anchor: middle; font-size: 13px; font-weight: normal; }
    .lini-scope-43aea669 .lini-marker { fill: var(--lini-stroke); stroke: none; }
  </style>
