      <path d="M -207.613 -62.5 L -14.3555 -62.5"/>
      <polygon class="lini-marker lini-marker-arrow" points="-10.3555,-62.5 -19.3555,-58 -19.3555,-67"/>
      <text class="lini-sequence-message" x="-106.2343" y="-74" dy="0.358em">perform your half</text>
    </g>
    <g class="lini-link" data-from="sender" data-to="sender">
      <path d="M 1.1445 -40.5 L 9.1445 -40.5 A 8 8 0 0 1 17.1445 -32.5 L 17.1445 -32.5 A 8 8 0 0 1 9.1445 -24.5 L 4.6445 -24.5"/>
      <polygon class="lini-marker lini-marker-arrow" points="0.6445,-24.5 9.6445,-29 9.6445,-20"/>
      <text class="lini-sequence-message" x="44.1665" y="-52" dy="0.358em">do the work</text>
    </g>
    <g class="lini-link" data-from="sender" data-to="receiver">
      <path d="M 1.1445 -2.5 L 193.2575 -2.5"/>
      <polygon class="lini-marker lini-marker-arrow" points="197.2575,-2.5 188.2575,2 188.2575,-7"/>
      <text class="lini-sequence-message" x="98.951" y="-14" dy="0.358em">the content, to its ingress</text>
    </g>
    <g class="lini-link lini-link-dashed" data-from="receiver" data-to="sender">
      <path d="M 196.7575 19.5 L 4.6445 19.5"/>
      <polygon class="lini-marker lini-marker-arrow" points="0.6445,19.5 9.6445,15 9.6445,24"/>
      <text class="lini-sequence-message" x="98.951" y="8" dy="0.358em">taken</text>
    </g>
    <g class="lini-link lini-link-dashed" data-from="sender" data-to="platform">
      <path d="M -10.8555 41.5 L -204.113 41.5"/>
      <polygon class="lini-marker lini-marker-arrow" points="-208.113,41.5 -199.113,37 -199.113,46"/>
      <text class="lini-sequence-message" x="-106.2343" y="30" dy="0.358em">a reference, never the content</text>
    </g>
    <g class="lini-link" data-from="platform" data-to="platform">
      <path d="M -207.613 63.5 L -199.613 63.5 A 8 8 0 0 1 -191.613 71.5 L -191.613 71.5 A 8 8 0 0 1 -199.613 79.5 L -204.113 79.5"/>
      <polygon class="lini-marker lini-marker-arrow" points="-208.113,79.5 -199.113,75 -199.113,84"/>
      <text class="lini-sequence-message" x="-60.2465" y="52" dy="0.358em">record the hop: who, which process, the hashes</text>
    </g>
  </g>
</svg>
