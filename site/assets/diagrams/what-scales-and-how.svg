      .lini-scope-0769ba95[data-theme="dark"], [data-theme="dark"] .lini-scope-0769ba95 { color-scheme: dark; }
      .lini-scope-0769ba95[data-theme="light"], [data-theme="light"] .lini-scope-0769ba95 { color-scheme: light; }
    }
