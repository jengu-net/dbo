    .lini-scope-0769ba95 .lini-cap { color: var(--lini-ink); font-weight: 600; }
    .lini-scope-0769ba95 .lini-eyebrow { color: var(--lini-faint); font-size: 11px; font-weight: bold; }
    .lini-scope-0769ba95 .lini-panel { fill: var(--lini-panel); stroke: var(--lini-line); stroke-width: 1.5; }
