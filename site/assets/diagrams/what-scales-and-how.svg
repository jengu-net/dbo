    .lini-scope-0769ba95 .lini-unit { fill: var(--lini-panel); stroke: var(--lini-accent); stroke-width: 1.5; }
    .lini-scope-0769ba95 .lini-unit-on { fill: var(--lini-seal-soft); stroke: var(--lini-seal); }
    .lini-scope-0769ba95 .lini-unit-off { fill: none; stroke: var(--lini-faint); stroke-width: 1.25; stroke-dasharray: 5.5,4.375; }
    .lini-scope-0769ba95 .lini-plus { color: var(--lini-faint); font-size: 16px; }
