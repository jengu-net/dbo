<svg xmlns="http://www.w3.org/2000/svg" viewBox="-384.75 -259.75 769.5 519.5" width="769.5" height="519.5" class="lini lini-scope-0769ba95" role="img" aria-labelledby="what-scales-and-how-title what-scales-and-how-desc">
  <title id="what-scales-and-how-title">What grows, and what it costs to grow it</title>
  <desc id="what-scales-and-how-desc">Five stacked layers, read top to bottom. Entry, where any node can take the role and adding one adds a place to arrive. Serving, where one node holds one tenant's writes. Routing, where a durable assignment says which node serves which tenant, with no broker. Work, where runners ask for work and report back, so adding one adds throughput and nothing else. Data, a database per tenant, where the unit that moves is a whole tenant. The serving and routing layers are drawn faint and dashed because they are specified and have no implementation; the others are built.</desc>
