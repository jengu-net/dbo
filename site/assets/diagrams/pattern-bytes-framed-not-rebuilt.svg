<svg xmlns="http://www.w3.org/2000/svg" viewBox="-385.5 -171.5 771 343" width="771" height="343" class="lini lini-scope-fdbd251a" role="img" aria-labelledby="pattern-bytes-framed-not-rebuilt-title pattern-bytes-framed-not-rebuilt-desc">
  <title id="pattern-bytes-framed-not-rebuilt-title">Parsed once, or parsed at every hop</title>
  <desc id="pattern-bytes-framed-not-rebuilt-desc">Two columns. On the left, a payload rebuilt at each layer: bytes to objects, objects to other objects, and back to bytes on the way out, so what comes out is a reconstruction. On the right, the payload framed and carried: the bytes as written are the truth, read once for whatever has to be indexed, and what is carried is not opened.</desc>
  <style>
    @layer lini.defaults {
      :root, .lini-scope-fdbd251a { color-scheme: light dark; --lini-accent: #a8641b; --lini-bg: #fbfaf8; --lini-body: #2c3a47; --lini-faint: #8695a3; --lini-fill: light-dark(white, #26262b); --lini-font-weight: 500; --lini-ink: #111a24; --lini-line: #e3e0da; --lini-muted: #5d6c7b; --lini-panel: #ffffff; --lini-seal: #14532d; --lini-seal-soft: #e7f0e9; --lini-stroke: #444444; }
      .lini-scope-fdbd251a[data-theme="dark"], [data-theme="dark"] .lini-scope-fdbd251a { color-scheme: dark; }
      .lini-scope-fdbd251a[data-theme="light"], [data-theme="light"] .lini-scope-fdbd251a { color-scheme: light; }
    }
    .lini-scope-fdbd251a { font-family: "Google Sans"; font-size: 15px; font-weight: var(--lini-font-weight); color: var(--lini-body); }
