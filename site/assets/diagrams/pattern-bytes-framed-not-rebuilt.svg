    .lini-scope-fdbd251a .lini-path { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-fdbd251a .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-fdbd251a .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-fdbd251a .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-fdbd251a .lini-cap { color: var(--lini-ink); font-weight: 600; }
    .lini-scope-fdbd251a .lini-eyebrow { color: var(--lini-faint); font-size: 11px; font-weight: bold; }
    .lini-scope-fdbd251a .lini-panel { fill: var(--lini-panel); stroke: var(--lini-line); stroke-width: 1.5; }
