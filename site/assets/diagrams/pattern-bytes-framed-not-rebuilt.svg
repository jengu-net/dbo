    .lini-scope-fdbd251a .lini-line-item { fill: var(--lini-bg); stroke: var(--lini-line); stroke-width: 1.25; }
    .lini-scope-fdbd251a .lini-lt { font-size: 12px; }
    .lini-scope-fdbd251a .lini-has { color: var(--lini-seal); font-weight: 600; }
    .lini-scope-fdbd251a .lini-miss { color: var(--lini-faint); }
    .lini-scope-fdbd251a .lini-body { color: var(--lini-muted); }
    .lini-scope-fdbd251a .lini-tile { fill: var(--lini-bg); stroke: var(--lini-line); stroke-width: 1.5; }
    .lini-scope-fdbd251a .lini-glyph { fill: none; stroke: var(--lini-accent); stroke-width: 2.25; }
    .lini-scope-fdbd251a .lini-solid { fill: var(--lini-seal); stroke: none; }
