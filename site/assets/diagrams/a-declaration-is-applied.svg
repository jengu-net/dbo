      <line x1="-332.9972" y1="-90" x2="-332.9972" y2="145"/>
    </g>
    <g class="lini-node lini-line" style="stroke: var(--lini-accent)" transform="translate(0,0)">
      <line x1="-97.4662" y1="-90" x2="-97.4662" y2="145"/>
    </g>
    <g class="lini-node lini-line" style="stroke: var(--lini-seal)" transform="translate(0,0)">
