      <text class="lini-text" x="0" y="0" dy="0.358em">The zone tenant&apos;s face</text>
    </g>
    <g class="lini-node lini-engine lini-box lini-block" data-id="chain" transform="translate(119.0008,-117.5)">
      <rect x="-94.6005" y="-26.5" width="189.201" height="53" rx="8" ry="8"/>
      <text class="lini-text" x="0" y="0" dy="0.358em">The declared-rules chain</text>
    </g>
    <g class="lini-node lini-face lini-box lini-block" data-id="tenantface" transform="translate(355.2597,-117.5)">
      <rect x="-70.7325" y="-26.5" width="141.465" height="53" rx="8" ry="8"/>
      <text class="lini-text" x="0" y="0" dy="0.358em">A tenant under it</text>
    </g>
    <g class="lini-node lini-note lini-path" style="stroke-width: 2; font-size: 13px" transform="translate(237.1302,99.5)">
      <path d="M -207.22850000000003 -13.5 L 198.04850000000002 -13.5 L 207.22850000000003 -4.3199999999999985 L 207.22850000000003 13.5 L -207.22850000000003 13.5 Z"/>
      <g class="lini-node lini-path" style="fill: var(--lini-stroke); stroke: none; stroke-width: 0" transform="translate(0,0)">
        <path d="M 198.04850000000002 -13.5 L 207.22850000000003 -4.3199999999999985 L 198.04850000000002 -4.3199999999999985 Z"/>
      </g>
      <text class="lini-text" x="0" y="0" dy="0.358em">A tenant may narrow what the zone declared. It may not widen it.</text>
    </g>
  </g>
  <g class="lini-links">
    <g class="lini-link" data-from="authority" data-to="zoneface">
      <path d="M -332.9972 -58 L -106.9662 -58"/>
      <polygon class="lini-marker lini-marker-arrow" points="-102.9662,-58 -111.9662,-53.5 -111.9662,-62.5"/>
      <text class="lini-sequence-message" x="-215.2317" y="-69.5" dy="0.358em">publish the vocabularies and the rules</text>
    </g>
    <g class="lini-link" data-from="zoneface" data-to="chain">
      <path d="M -91.4662 -26 L 109.5008 -26"/>
      <polygon class="lini-marker lini-marker-arrow" points="113.5008,-26 104.5008,-21.5 104.5008,-30.5"/>
      <text class="lini-sequence-message" x="10.7673" y="-37.5" dy="0.358em">record them as ordinary records</text>
    </g>
    <g class="lini-link lini-link-dashed" data-from="chain" data-to="zoneface">
      <path d="M 113.0008 6 L -87.9662 6"/>
      <polygon class="lini-marker lini-marker-arrow" points="-91.9662,6 -82.9662,1.5 -82.9662,10.5"/>
      <text class="lini-sequence-message" x="10.7673" y="-5.5" dy="0.358em">declared</text>
    </g>
    <g class="lini-link" data-from="tenantface" data-to="chain">
      <path d="M 355.2597 38 L 128.5008 38"/>
      <polygon class="lini-marker lini-marker-arrow" points="124.5008,38 133.5008,33.5 133.5008,42.5"/>
      <text class="lini-sequence-message" x="237.1302" y="26.5" dy="0.358em">what applies to me?</text>
    </g>
    <g class="lini-link lini-link-dashed" data-from="chain" data-to="tenantface">
      <path d="M 125.0008 70 L 351.7597 70"/>
      <polygon class="lini-marker lini-marker-arrow" points="355.7597,70 346.7597,74.5 346.7597,65.5"/>
      <text class="lini-sequence-message" x="237.1302" y="58.5" dy="0.358em">the zone&apos;s rules, and this tenant&apos;s own</text>
    </g>
  </g>
</svg>
