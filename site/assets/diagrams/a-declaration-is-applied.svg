      <rect x="-5" y="-15" width="10" height="30" rx="0" ry="0"/>
    </g>
    <g class="lini-node lini-block" style="fill: var(--lini-seal-soft); stroke: var(--lini-seal)" transform="translate(119.0008,54)">
      <rect x="-5" y="-15" width="10" height="30" rx="0" ry="0"/>
