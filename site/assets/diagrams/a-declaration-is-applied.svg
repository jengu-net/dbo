<svg xmlns="http://www.w3.org/2000/svg" viewBox="-464.3587 -165 928.7175 330" width="928.7175" height="330" class="lini lini-scope-69365ed8" role="img" aria-labelledby="a-declaration-is-applied-title a-declaration-is-applied-desc">
  <title id="a-declaration-is-applied-title">A zone declares, and a tenant narrows</title>
  <desc id="a-declaration-is-applied-desc">A jurisdiction's authority publishes its vocabularies and rules to the zone tenant's face, where they are recorded as ordinary records rather than as code. A tenant under that zone asks what applies to it and receives the zone's rules alongside its own. Configuration travels one direction, and a tenant may make a declared rule stricter but never looser.</desc>
  <style>
    @layer lini.defaults {
      :root, .lini-scope-69365ed8 { color-scheme: light dark; --lini-accent: #a8641b; --lini-accent-soft: #f6efe4; --lini-bg: #fbfaf8; --lini-faint: #8695a3; --lini-fg: light-dark(black, #e8e8ea); --lini-fill: light-dark(white, #26262b); --lini-font-weight: 500; --lini-link-font-weight: 400; --lini-seal: #14532d; --lini-seal-soft: #e7f0e9; --lini-stroke: #444444; --lini-text-color: var(--lini-fg); }
      .lini-scope-69365ed8[data-theme="dark"], [data-theme="dark"] .lini-scope-69365ed8 { color-scheme: dark; }
      .lini-scope-69365ed8[data-theme="light"], [data-theme="light"] .lini-scope-69365ed8 { color-scheme: light; }
    }
    .lini-scope-69365ed8 { font-family: "Google Sans"; font-size: 13px; font-weight: var(--lini-font-weight); color: var(--lini-text-color); }
    .lini-scope-69365ed8 .lini-block { fill: none; stroke: none; stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-69365ed8 .lini-path { stroke-dasharray: none; }
    .lini-scope-69365ed8 .lini-line { fill: none; stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-69365ed8 .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-69365ed8 .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-69365ed8 .lini-note { fill: var(--lini-fill); stroke: var(--lini-stroke); }
    .lini-scope-69365ed8 .lini-outside { fill: var(--lini-bg); stroke: var(--lini-faint); }
    .lini-scope-69365ed8 .lini-face { fill: var(--lini-accent-soft); stroke: var(--lini-accent); }
    .lini-scope-69365ed8 .lini-engine { fill: var(--lini-seal-soft); stroke: var(--lini-seal); }
    .lini-scope-69365ed8 .lini-link { fill: none; stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-69365ed8 .lini-link-dashed { stroke-dasharray: 7,5.5; }
    .lini-scope-69365ed8 .lini-sequence-message { fill: currentColor; stroke: none; text-anchor: middle; font-size: 13px; font-weight: normal; }
    .lini-scope-69365ed8 .lini-marker { fill: var(--lini-stroke); stroke: none; }
  </style>
