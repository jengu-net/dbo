<svg xmlns="http://www.w3.org/2000/svg" viewBox="-384 -133.375 768 262.5" width="768" height="262.5" class="lini lini-scope-062b0b19" role="img" aria-labelledby="one-feed-four-consumers-title one-feed-four-consumers-desc">
  <title id="one-feed-four-consumers-title">One ordered feed, four consumers at different positions</title>
  <desc id="one-feed-four-consumers-desc">A single ordered sequence of committed changes. Four consumers — a paging client, a subscriber, a dependent tenant and an offline appliance — each sit at a position on it, and the distance from a consumer to the head is its lag.</desc>
  <style>
    @layer lini.defaults {
      :root, .lini-scope-062b0b19 { color-scheme: light dark; --lini-accent: #a8641b; --lini-bg: #fbfaf8; --lini-body: #2c3a47; --lini-faint: #8695a3; --lini-fill: light-dark(white, #26262b); --lini-font-weight: 500; --lini-line: #e3e0da; --lini-muted: #5d6c7b; --lini-stroke: #444444; }
      .lini-scope-062b0b19[data-theme="dark"], [data-theme="dark"] .lini-scope-062b0b19 { color-scheme: dark; }
      .lini-scope-062b0b19[data-theme="light"], [data-theme="light"] .lini-scope-062b0b19 { color-scheme: light; }
    }
    .lini-scope-062b0b19 { font-family: "Google Sans"; font-size: 15px; font-weight: var(--lini-font-weight); color: var(--lini-body); }
    .lini-scope-062b0b19 .lini-block { fill: none; stroke: none; stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-062b0b19 .lini-oval { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-062b0b19 .lini-line { fill: none; stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-062b0b19 .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-062b0b19 .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-062b0b19 .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-062b0b19 .lini-small { color: var(--lini-muted); font-size: 12.5px; }
    .lini-scope-062b0b19 .lini-eyebrow { color: var(--lini-faint); font-size: 11px; font-weight: bold; }
    .lini-scope-062b0b19 .lini-event { fill: var(--lini-bg); stroke: var(--lini-line); stroke-width: 1.25; }
    .lini-scope-062b0b19 .lini-lag { stroke: var(--lini-accent); stroke-width: 1.5; opacity: 0.5; }
    .lini-scope-062b0b19 .lini-head-line { stroke: var(--lini-accent); stroke-width: 1.75; }
    .lini-scope-062b0b19 .lini-dot { fill: var(--lini-accent); stroke: none; }
    .lini-scope-062b0b19 .lini-name { color: var(--lini-body); font-size: 13px; }
    .lini-scope-062b0b19 .lini-head-label { color: var(--lini-accent); font-size: 12px; font-weight: 600; }
  </style>
