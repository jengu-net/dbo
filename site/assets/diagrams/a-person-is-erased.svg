<svg xmlns="http://www.w3.org/2000/svg" viewBox="-499.668 -245 999.336 490" width="999.336" height="490" class="lini lini-scope-8e3eeb16" role="img" aria-labelledby="a-person-is-erased-title a-person-is-erased-desc">
  <title id="a-person-is-erased-title">A person is erased by destroying a key</title>
  <desc id="a-person-is-erased-desc">The tenant asks for a person to be erased. The seal destroys that person's key and records the act. Nothing is rewritten and no row is walked, so the history a record already had stays verifiable. Afterwards the rows are still present and every version of them reads the same way: the identifying elements are sealed bytes that cannot be opened by anybody, the store included.</desc>
