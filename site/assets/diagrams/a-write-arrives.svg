<svg xmlns="http://www.w3.org/2000/svg" viewBox="-410.9695 -229 821.939 458" width="821.939" height="458" class="lini lini-scope-8e3eeb16" role="img" aria-labelledby="a-write-arrives-title a-write-arrives-desc">
  <title id="a-write-arrives-title">A write, from the wire to the row</title>
  <desc id="a-write-arrives-desc">A client sends a resource to the tenant's own FHIR face. The face parses the bytes once and hands them to the object engine with the type the tenant declared. The engine derives the searchable envelope from the payload and resolves the record's identity, then writes the payload, the envelope, the trail entry and the change event to the tenant's database in one transaction. The version comes back and the face answers the client with a status, an ETag and a Location.</desc>
