    .lini-scope-d6be23cf .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-d6be23cf .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-d6be23cf .lini-cap { color: var(--lini-ink); font-weight: 600; }
    .lini-scope-d6be23cf .lini-eyebrow { color: var(--lini-faint); font-size: 11px; font-weight: bold; }
