<svg xmlns="http://www.w3.org/2000/svg" viewBox="-384.75 -149.25 770.25 298.5" width="770.25" height="298.5" class="lini lini-scope-d6be23cf" role="img" aria-labelledby="pattern-the-tenant-is-a-database-title pattern-the-tenant-is-a-database-desc">
  <title id="pattern-the-tenant-is-a-database-title">The same query with a bug in it</title>
  <desc id="pattern-the-tenant-is-a-database-desc">Two arrangements side by side. On the left, one database holding four tenants A, B, C and D, kept apart by a predicate written by hand on every query. On the right, a database each: a query that forgets the predicate still reaches only tenant A, because nothing else is there. The difference decides what the sentence "your data is gone" is worth.</desc>
