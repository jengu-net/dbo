    .lini-scope-d2c8fed1 .lini-face { fill: var(--lini-panel); stroke: var(--lini-line); stroke-width: 1.5; }
    .lini-scope-d2c8fed1 .lini-unbuilt { fill: none; stroke-dasharray: 3,2.5; }
    .lini-scope-d2c8fed1 .lini-title { color: var(--lini-ink); font-size: 13px; font-weight: 600; }
