<svg xmlns="http://www.w3.org/2000/svg" viewBox="-385.5 -176.25 770.25 352.5" width="770.25" height="352.5" class="lini lini-scope-560c989d" role="img" aria-labelledby="pattern-a-country-is-a-zone-title pattern-a-country-is-a-zone-desc">
  <title id="pattern-a-country-is-a-zone-title">What belongs to a country, not to a product</title>
  <desc id="pattern-a-country-is-a-zone-desc">At the top, the zone, declaring once for everyone inside it which identifier systems establish that a person is who they say they are, which brokers may authenticate one, and which subject domains exist. Beneath it three tenants in that zone: a hospital taking all of it, a laboratory narrowing to two brokers, and a registry narrowing further still. None of them can widen the set.</desc>
