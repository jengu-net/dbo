<svg xmlns="http://www.w3.org/2000/svg" viewBox="-386.25 -153.5 772.5 307" width="772.5" height="307" class="lini lini-scope-08280bcf" role="img" aria-labelledby="pattern-two-parties-bound-the-claim-title pattern-two-parties-bound-the-claim-desc">
  <title id="pattern-two-parties-bound-the-claim-title">Neither side alone decides</title>
  <desc id="pattern-two-parties-bound-the-claim-desc">Three panels. On the left, what a participant's credential covers: everything it was enrolled to do anywhere in the tenant. On the right, what the step admits: who may perform this stage, declared with the step rather than with the person. In the middle, sealed, what may actually be claimed: the overlap and nothing else, because a step cannot grant more than the participant already holds.</desc>
  <style>
    @layer lini.defaults {
      :root, .lini-scope-08280bcf { color-scheme: light dark; --lini-accent: #a8641b; --lini-bg: #fbfaf8; --lini-body: #2c3a47; --lini-faint: #8695a3; --lini-fill: light-dark(white, #26262b); --lini-font-weight: 500; --lini-ink: #111a24; --lini-line: #e3e0da; --lini-muted: #5d6c7b; --lini-panel: #ffffff; --lini-seal: #14532d; --lini-seal-soft: #e7f0e9; --lini-stroke: #444444; }
      .lini-scope-08280bcf[data-theme="dark"], [data-theme="dark"] .lini-scope-08280bcf { color-scheme: dark; }
      .lini-scope-08280bcf[data-theme="light"], [data-theme="light"] .lini-scope-08280bcf { color-scheme: light; }
    }
    .lini-scope-08280bcf { font-family: "Google Sans"; font-size: 15px; font-weight: var(--lini-font-weight); color: var(--lini-body); }
    .lini-scope-08280bcf .lini-block { fill: none; stroke: none; stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-08280bcf .lini-oval { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-08280bcf .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-08280bcf .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-08280bcf .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-08280bcf .lini-small { color: var(--lini-muted); font-size: 12.5px; }
    .lini-scope-08280bcf .lini-cap { color: var(--lini-ink); font-weight: 600; }
    .lini-scope-08280bcf .lini-eyebrow { color: var(--lini-faint); font-size: 11px; font-weight: bold; }
    .lini-scope-08280bcf .lini-panel { fill: var(--lini-panel); stroke: var(--lini-line); stroke-width: 1.5; }
    .lini-scope-08280bcf .lini-sealed { fill: var(--lini-seal-soft); stroke: var(--lini-seal); }
    .lini-scope-08280bcf .lini-has { color: var(--lini-seal); font-weight: 600; }
    .lini-scope-08280bcf .lini-body { color: var(--lini-muted); }
    .lini-scope-08280bcf .lini-tile { fill: var(--lini-bg); stroke: var(--lini-line); stroke-width: 1.5; }
    .lini-scope-08280bcf .lini-ring { fill: none; stroke: var(--lini-accent); stroke-width: 2.25; }
    .lini-scope-08280bcf .lini-sdot { fill: var(--lini-seal); stroke: none; }
  </style>
