    .lini-scope-535f3bc2 .lini-ring { fill: none; stroke: var(--lini-accent); stroke-width: 2.25; }
    .lini-scope-535f3bc2 .lini-ghostline { stroke: var(--lini-faint); stroke-width: 1.5; stroke-dasharray: 6,4.75; }
  </style>
