<svg xmlns="http://www.w3.org/2000/svg" viewBox="-385.5 -148 771 296" width="771" height="296" class="lini lini-scope-535f3bc2" role="img" aria-labelledby="pattern-erasure-destroys-a-key-title pattern-erasure-destroys-a-key-desc">
  <title id="pattern-erasure-destroys-a-key-title">Both obligations, kept</title>
  <desc id="pattern-erasure-destroys-a-key-desc">Two columns. On the left, erasure done by rewriting: entries are edited or removed, the chain no longer verifies, and the record of what happened is worth less than it was. On the right, erasure done by destroying a key: every entry stays, complete and in order, and the person evaporates from all of them. What happened is still provable; who it happened to is gone.</desc>
  <style>
    @layer lini.defaults {
      :root, .lini-scope-535f3bc2 { color-scheme: light dark; --lini-accent: #a8641b; --lini-bg: #fbfaf8; --lini-body: #2c3a47; --lini-faint: #8695a3; --lini-fill: light-dark(white, #26262b); --lini-font-weight: 500; --lini-ink: #111a24; --lini-line: #e3e0da; --lini-muted: #5d6c7b; --lini-panel: #ffffff; --lini-seal: #14532d; --lini-seal-soft: #e7f0e9; --lini-stroke: #444444; }
      .lini-scope-535f3bc2[data-theme="dark"], [data-theme="dark"] .lini-scope-535f3bc2 { color-scheme: dark; }
      .lini-scope-535f3bc2[data-theme="light"], [data-theme="light"] .lini-scope-535f3bc2 { color-scheme: light; }
    }
    .lini-scope-535f3bc2 { font-family: "Google Sans"; font-size: 15px; font-weight: var(--lini-font-weight); color: var(--lini-body); }
