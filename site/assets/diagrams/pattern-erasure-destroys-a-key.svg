    .lini-scope-535f3bc2 .lini-line { fill: none; stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-535f3bc2 .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-535f3bc2 .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-535f3bc2 .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-535f3bc2 .lini-small { color: var(--lini-muted); font-size: 12.5px; }
