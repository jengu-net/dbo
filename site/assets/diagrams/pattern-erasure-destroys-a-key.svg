    .lini-scope-535f3bc2 .lini-line-item { fill: var(--lini-bg); stroke: var(--lini-line); stroke-width: 1.25; }
    .lini-scope-535f3bc2 .lini-lt { font-size: 12px; }
    .lini-scope-535f3bc2 .lini-has { color: var(--lini-seal); font-weight: 600; }
    .lini-scope-535f3bc2 .lini-miss { color: var(--lini-faint); }
