<svg xmlns="http://www.w3.org/2000/svg" viewBox="-328.9835 -179.5 657.967 359" width="657.967" height="359" class="lini lini-scope-6681f674" role="img" aria-labelledby="a-consumer-catches-up-title a-consumer-catches-up-desc">
  <title id="a-consumer-catches-up-title">A consumer catches up on the feed</title>
  <desc id="a-consumer-catches-up-desc">A consumer is a name and a position. It asks the feed for the events after its position, the feed reads a page from the tenant's database by keyset cursor, and the page comes back with the position that follows it. The consumer handles every event and only then records where it has reached, so a consumer restored from its name alone resumes where it left off. Paging, subscription, replication and catch-up are this one exchange.</desc>
