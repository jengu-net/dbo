<svg xmlns="http://www.w3.org/2000/svg" viewBox="-386.875 -156.25 773.75 312.5" width="773.75" height="312.5" class="lini lini-scope-6bb46cfa" role="img" aria-labelledby="pattern-work-is-the-reason-title pattern-work-is-the-reason-desc">
  <title id="pattern-work-is-the-reason-title">One object, three jobs</title>
  <desc id="pattern-work-is-the-reason-desc">Three panels left to right. A step declares which documents it consumes, which it may change, and who may perform it. A participant claims a run of that step, and what arrives is exactly what the run named. The run is then the record both of the work and of the reason the data was reached, one artefact rather than two to be correlated afterwards. Beneath the row, drawn faint, is the door that does not exist: a general read to fall back on when the step did not name the document.</desc>
