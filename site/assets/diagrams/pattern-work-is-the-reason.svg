    .lini-scope-6bb46cfa .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-6bb46cfa .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-6bb46cfa .lini-small { color: var(--lini-muted); font-size: 12.5px; }
