<svg xmlns="http://www.w3.org/2000/svg" viewBox="-385.5 -155 771 310" width="771" height="310" class="lini lini-scope-1ff984b0" role="img" aria-labelledby="pattern-the-trail-is-records-title pattern-the-trail-is-records-desc">
  <title id="pattern-the-trail-is-records-title">Where the evidence is kept</title>
  <desc id="pattern-the-trail-is-records-desc">Two columns. On the left, the audit trail shipped to an aggregator: somebody else owns the store, it is retained on their dial rather than yours, and one day the contract ends — three ways for the evidence to be missing on the day somebody asks. On the right, the trail as records in the tenant's own store: on its change feed like everything else, exported and restored with it, and with no interface that edits an entry, for anybody, including the party running the deployment.</desc>
  <style>
    @layer lini.defaults {
      :root, .lini-scope-1ff984b0 { color-scheme: light dark; --lini-accent: #a8641b; --lini-bg: #fbfaf8; --lini-body: #2c3a47; --lini-faint: #8695a3; --lini-fill: light-dark(white, #26262b); --lini-font-weight: 500; --lini-ink: #111a24; --lini-line: #e3e0da; --lini-muted: #5d6c7b; --lini-panel: #ffffff; --lini-seal: #14532d; --lini-seal-soft: #e7f0e9; --lini-stroke: #444444; }
      .lini-scope-1ff984b0[data-theme="dark"], [data-theme="dark"] .lini-scope-1ff984b0 { color-scheme: dark; }
      .lini-scope-1ff984b0[data-theme="light"], [data-theme="light"] .lini-scope-1ff984b0 { color-scheme: light; }
    }
    .lini-scope-1ff984b0 { font-family: "Google Sans"; font-size: 15px; font-weight: var(--lini-font-weight); color: var(--lini-body); }
    .lini-scope-1ff984b0 .lini-block { fill: none; stroke: none; stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-1ff984b0 .lini-oval { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-1ff984b0 .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-1ff984b0 .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-1ff984b0 .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-1ff984b0 .lini-small { color: var(--lini-muted); font-size: 12.5px; }
    .lini-scope-1ff984b0 .lini-cap { color: var(--lini-ink); font-weight: 600; }
    .lini-scope-1ff984b0 .lini-eyebrow { color: var(--lini-faint); font-size: 11px; font-weight: bold; }
    .lini-scope-1ff984b0 .lini-panel { fill: var(--lini-panel); stroke: var(--lini-line); stroke-width: 1.5; }
    .lini-scope-1ff984b0 .lini-sealed { fill: var(--lini-seal-soft); stroke: var(--lini-seal); }
    .lini-scope-1ff984b0 .lini-dashed { fill: none; stroke: var(--lini-faint); stroke-width: 1.5; stroke-dasharray: 6,4.75; }
    .lini-scope-1ff984b0 .lini-line-item { fill: var(--lini-bg); stroke: var(--lini-line); stroke-width: 1.25; }
    .lini-scope-1ff984b0 .lini-lt { font-size: 12px; }
    .lini-scope-1ff984b0 .lini-has { color: var(--lini-seal); font-weight: 600; }
    .lini-scope-1ff984b0 .lini-miss { color: var(--lini-faint); }
    .lini-scope-1ff984b0 .lini-tile { fill: var(--lini-bg); stroke: var(--lini-line); stroke-width: 1.5; }
    .lini-scope-1ff984b0 .lini-rec { fill: var(--lini-panel); stroke: var(--lini-accent); stroke-width: 2; }
    .lini-scope-1ff984b0 .lini-sdot { fill: var(--lini-seal); stroke: none; }
  </style>
