<svg xmlns="http://www.w3.org/2000/svg" viewBox="-387 -100.25 774 200.5" width="774" height="200.5" class="lini lini-scope-8dc9f2bc" role="img" aria-labelledby="work-is-a-record-title work-is-a-record-desc">
  <title id="work-is-a-record-title">Work held in the store, among the records</title>
  <desc id="work-is-a-record-desc">One store holding six records side by side: three content records — Patient, Observation and Encounter — and three runs, marked apart. Beneath them, the four properties a run has by being a record: history, an audit trail, an owner, and never having been in flight.</desc>
  <style>
    @layer lini.defaults {
      :root, .lini-scope-8dc9f2bc { color-scheme: light dark; --lini-accent: #a8641b; --lini-accent-soft: #f6efe4; --lini-bg: #fbfaf8; --lini-body: #2c3a47; --lini-faint: #8695a3; --lini-fill: light-dark(white, #26262b); --lini-font-weight: 500; --lini-ink: #111a24; --lini-line: #e3e0da; --lini-muted: #5d6c7b; --lini-panel: #ffffff; --lini-seal: #14532d; --lini-stroke: #444444; }
      .lini-scope-8dc9f2bc[data-theme="dark"], [data-theme="dark"] .lini-scope-8dc9f2bc { color-scheme: dark; }
      .lini-scope-8dc9f2bc[data-theme="light"], [data-theme="light"] .lini-scope-8dc9f2bc { color-scheme: light; }
    }
    .lini-scope-8dc9f2bc { font-family: "Google Sans"; font-size: 15px; font-weight: var(--lini-font-weight); color: var(--lini-body); }
    .lini-scope-8dc9f2bc .lini-block { fill: none; stroke: none; stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-8dc9f2bc .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-8dc9f2bc .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-8dc9f2bc .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-8dc9f2bc .lini-cap { color: var(--lini-ink); font-weight: 600; }
    .lini-scope-8dc9f2bc .lini-eyebrow { color: var(--lini-faint); font-size: 11px; font-weight: bold; }
    .lini-scope-8dc9f2bc .lini-panel { fill: var(--lini-panel); stroke: var(--lini-line); stroke-width: 1.5; }
    .lini-scope-8dc9f2bc .lini-chip { fill: var(--lini-bg); stroke: var(--lini-line); stroke-width: 1.25; color: var(--lini-body); font-size: 12px; }
    .lini-scope-8dc9f2bc .lini-live { fill: var(--lini-accent-soft); stroke: var(--lini-accent); color: var(--lini-accent); font-weight: 600; }
    .lini-scope-8dc9f2bc .lini-has { color: var(--lini-seal); font-weight: 600; }
    .lini-scope-8dc9f2bc .lini-body { color: var(--lini-muted); }
  </style>
