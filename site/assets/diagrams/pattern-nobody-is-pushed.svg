    .lini-scope-f6877f98 .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-f6877f98 .lini-small { color: var(--lini-muted); font-size: 12.5px; }
    .lini-scope-f6877f98 .lini-cap { color: var(--lini-ink); font-weight: 600; }
    .lini-scope-f6877f98 .lini-eyebrow { color: var(--lini-faint); font-size: 11px; font-weight: bold; }
