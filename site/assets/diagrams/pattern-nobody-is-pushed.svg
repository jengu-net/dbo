<svg xmlns="http://www.w3.org/2000/svg" viewBox="-385.5 -170.25 771 340.5" width="771" height="340.5" class="lini lini-scope-f6877f98" role="img" aria-labelledby="pattern-nobody-is-pushed-title pattern-nobody-is-pushed-desc">
  <title id="pattern-nobody-is-pushed-title">Which direction the connection opens</title>
  <desc id="pattern-nobody-is-pushed-desc">On the left, the store, holding what is available to each participant and opening nothing outward. On the right, three places that ask: one behind a router with no public address, one offline for a weekend, and one belonging to a rival organisation. Each asks what is available to it, takes it, and reports back. Beneath, drawn faint, is what is therefore not needed: an address to call, a hole in a firewall, a queue held open for a participant that is asleep, or a retry schedule aimed at a building.</desc>
