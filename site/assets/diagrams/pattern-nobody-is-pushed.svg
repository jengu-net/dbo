      .lini-scope-f6877f98[data-theme="dark"], [data-theme="dark"] .lini-scope-f6877f98 { color-scheme: dark; }
      .lini-scope-f6877f98[data-theme="light"], [data-theme="light"] .lini-scope-f6877f98 { color-scheme: light; }
    }
