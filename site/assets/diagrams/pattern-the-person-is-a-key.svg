<svg xmlns="http://www.w3.org/2000/svg" viewBox="-385.5 -136 771 272" width="771" height="272" class="lini lini-scope-809a01f1" role="img" aria-labelledby="pattern-the-person-is-a-key-title pattern-the-person-is-a-key-desc">
  <title id="pattern-the-person-is-a-key-title">Encrypted where it is written</title>
  <desc id="pattern-the-person-is-a-key-desc">On the left, the write itself: identifying elements are sealed there, with a key belonging to that one person, and re-identification goes through a single recorded place. On the right, everything downstream — the backup, the export, the change feed, the dependent copy — each carrying ciphertext because of where the seal is placed rather than because four separate paths were each written correctly.</desc>
