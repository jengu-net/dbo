    .lini-scope-809a01f1 .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-809a01f1 .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-809a01f1 .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-809a01f1 .lini-small { color: var(--lini-muted); font-size: 12.5px; }
    .lini-scope-809a01f1 .lini-cap { color: var(--lini-ink); font-weight: 600; }
