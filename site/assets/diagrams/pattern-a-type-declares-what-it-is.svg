<svg xmlns="http://www.w3.org/2000/svg" viewBox="-385.5 -180.5 771 361" width="771" height="361" class="lini lini-scope-bff86596" role="img" aria-labelledby="pattern-a-type-declares-what-it-is-title pattern-a-type-declares-what-it-is-desc">
  <title id="pattern-a-type-declares-what-it-is-title">Asked once, or asked everywhere</title>
  <desc id="pattern-a-type-declares-what-it-is-desc">Two columns. On the left, the questions about a record's discipline answered by whoever happens to write each path into the store: the import job, the correction screen, the nightly clean-up, and the one written in a hurry. On the right, the same questions declared once on the type itself: whether a version may be replaced or only added to, whether every touch is audited, how long it is kept at least and at most, and what identifies one.</desc>
  <style>
