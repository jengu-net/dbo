      :root, .lini-scope-bff86596 { color-scheme: light dark; --lini-accent: #a8641b; --lini-bg: #fbfaf8; --lini-body: #2c3a47; --lini-faint: #8695a3; --lini-fill: light-dark(white, #26262b); --lini-font-weight: 500; --lini-ink: #111a24; --lini-line: #e3e0da; --lini-muted: #5d6c7b; --lini-panel: #ffffff; --lini-seal: #14532d; --lini-seal-soft: #e7f0e9; --lini-stroke: #444444; }
      .lini-scope-bff86596[data-theme="dark"], [data-theme="dark"] .lini-scope-bff86596 { color-scheme: dark; }
      .lini-scope-bff86596[data-theme="light"], [data-theme="light"] .lini-scope-bff86596 { color-scheme: light; }
    }
    .lini-scope-bff86596 { font-family: "Google Sans"; font-size: 15px; font-weight: var(--lini-font-weight); color: var(--lini-body); }
