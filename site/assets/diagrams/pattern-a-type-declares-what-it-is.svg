    .lini-scope-bff86596 .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-bff86596 .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-bff86596 .lini-cap { color: var(--lini-ink); font-weight: 600; }
    .lini-scope-bff86596 .lini-eyebrow { color: var(--lini-faint); font-size: 11px; font-weight: bold; }
    .lini-scope-bff86596 .lini-panel { fill: var(--lini-panel); stroke: var(--lini-line); stroke-width: 1.5; }
    .lini-scope-bff86596 .lini-sealed { fill: var(--lini-seal-soft); stroke: var(--lini-seal); }
