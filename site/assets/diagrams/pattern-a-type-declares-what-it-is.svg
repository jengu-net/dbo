    .lini-scope-bff86596 .lini-rec { fill: var(--lini-panel); stroke: var(--lini-accent); stroke-width: 2; }
    .lini-scope-bff86596 .lini-solid { fill: var(--lini-seal); stroke: none; }
  </style>
