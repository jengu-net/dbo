    <g class="lini-link" data-from="faces" data-to="engine">
      <path d="M 321 85 L 321 85 A 16 16 0 0 1 337 101 L 337 141.5 A 12.5 12.5 0 0 1 324.5 154 L 324.5 154"/>
      <polygon class="lini-marker lini-marker-arrow" points="320.5,154 329.5,149.5 329.5,158.5"/>
