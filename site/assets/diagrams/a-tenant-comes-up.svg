<svg xmlns="http://www.w3.org/2000/svg" viewBox="-595.5617 -205 1191.1235 410" width="1191.1235" height="410" class="lini lini-scope-8e3eeb16" role="img" aria-labelledby="a-tenant-comes-up-title a-tenant-comes-up-desc">
  <title id="a-tenant-comes-up-title">A tenant is built in order</title>
  <desc id="a-tenant-comes-up-desc">A spec file appears where the deployment reads specs, and the scan asks the runtime to bring that code up. The runtime creates the tenant's own database, migrates it and seeds its terminology baseline, which is nearly all of the cost. The tenant then reaches dispatch, where its store and feeds exist, and its surfaces are mounted before it is announced as serving.</desc>
