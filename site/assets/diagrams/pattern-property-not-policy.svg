<svg xmlns="http://www.w3.org/2000/svg" viewBox="-385.5 -185.375 771 370.75" width="771" height="370.75" class="lini lini-scope-ca64d8bc" role="img" aria-labelledby="pattern-property-not-policy-title pattern-property-not-policy-desc">
  <title id="pattern-property-not-policy-title">The same promise, made twice</title>
  <desc id="pattern-property-not-policy-desc">Two columns of equal size. On the left, the promise as a policy: a dashed panel saying only the treating clinician reads a record and only for care, written down, trained, audited once a year, and set aside on a bad Tuesday. On the right, the same promise as a property: a sealed panel saying a read is a step of a process and a step names what it may reach, so there is no general read behind it, nothing to set aside, and the attempt is itself the audit entry.</desc>
  <style>
    @layer lini.defaults {
      :root, .lini-scope-ca64d8bc { color-scheme: light dark; --lini-bg: #fbfaf8; --lini-body: #2c3a47; --lini-faint: #8695a3; --lini-fill: light-dark(white, #26262b); --lini-font-weight: 500; --lini-ink: #111a24; --lini-line: #e3e0da; --lini-muted: #5d6c7b; --lini-panel: #ffffff; --lini-seal: #14532d; --lini-seal-soft: #e7f0e9; --lini-stroke: #444444; }
      .lini-scope-ca64d8bc[data-theme="dark"], [data-theme="dark"] .lini-scope-ca64d8bc { color-scheme: dark; }
      .lini-scope-ca64d8bc[data-theme="light"], [data-theme="light"] .lini-scope-ca64d8bc { color-scheme: light; }
    }
    .lini-scope-ca64d8bc { font-family: "Google Sans"; font-size: 15px; font-weight: var(--lini-font-weight); color: var(--lini-body); }
