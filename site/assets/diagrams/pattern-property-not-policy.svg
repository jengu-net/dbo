    .lini-scope-ca64d8bc .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-ca64d8bc .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-ca64d8bc .lini-small { color: var(--lini-muted); font-size: 12.5px; }
    .lini-scope-ca64d8bc .lini-cap { color: var(--lini-ink); font-weight: 600; }
    .lini-scope-ca64d8bc .lini-eyebrow { color: var(--lini-faint); font-size: 11px; font-weight: bold; }
    .lini-scope-ca64d8bc .lini-panel { fill: var(--lini-panel); stroke: var(--lini-line); stroke-width: 1.5; }
    .lini-scope-ca64d8bc .lini-sealed { fill: var(--lini-seal-soft); stroke: var(--lini-seal); }
    .lini-scope-ca64d8bc .lini-dashed { fill: none; stroke: var(--lini-faint); stroke-width: 1.5; stroke-dasharray: 6,4.75; }
    .lini-scope-ca64d8bc .lini-line-item { fill: var(--lini-bg); stroke: var(--lini-line); stroke-width: 1.25; }
    .lini-scope-ca64d8bc .lini-lt { font-size: 12px; }
    .lini-scope-ca64d8bc .lini-has { color: var(--lini-seal); font-weight: 600; }
    .lini-scope-ca64d8bc .lini-miss { color: var(--lini-faint); }
    .lini-scope-ca64d8bc .lini-body { color: var(--lini-muted); }
    .lini-scope-ca64d8bc .lini-tile { fill: var(--lini-bg); stroke: var(--lini-line); stroke-width: 1.5; }
    .lini-scope-ca64d8bc .lini-solid { fill: var(--lini-seal); stroke: none; }
    .lini-scope-ca64d8bc .lini-ghost { fill: none; stroke: var(--lini-faint); stroke-width: 1.5; stroke-dasharray: 6,4.75; }
  </style>
