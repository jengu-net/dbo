    .lini-scope-26060ff6 .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-26060ff6 .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-26060ff6 .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-26060ff6 .lini-small { color: var(--lini-muted); font-size: 12.5px; }
    .lini-scope-26060ff6 .lini-cap { color: var(--lini-ink); font-weight: 600; }
    .lini-scope-26060ff6 .lini-eyebrow { color: var(--lini-faint); font-size: 11px; font-weight: bold; }
    .lini-scope-26060ff6 .lini-panel { fill: var(--lini-panel); stroke: var(--lini-line); stroke-width: 1.5; }
    .lini-scope-26060ff6 .lini-sealed { fill: var(--lini-seal-soft); stroke: var(--lini-seal); }
    .lini-scope-26060ff6 .lini-dashed { fill: none; stroke: var(--lini-faint); stroke-width: 1.5; stroke-dasharray: 6,4.75; }
    .lini-scope-26060ff6 .lini-line-item { fill: var(--lini-bg); stroke: var(--lini-line); stroke-width: 1.25; }
    .lini-scope-26060ff6 .lini-lt { font-size: 12px; }
    .lini-scope-26060ff6 .lini-has { color: var(--lini-seal); font-weight: 600; }
    .lini-scope-26060ff6 .lini-miss { color: var(--lini-faint); }
    .lini-scope-26060ff6 .lini-tile { fill: var(--lini-bg); stroke: var(--lini-line); stroke-width: 1.5; }
    .lini-scope-26060ff6 .lini-rec { fill: var(--lini-panel); stroke: var(--lini-accent); stroke-width: 2; }
    .lini-scope-26060ff6 .lini-sdot { fill: var(--lini-seal); stroke: none; }
    .lini-scope-26060ff6 .lini-bar { stroke: var(--lini-accent); stroke-width: 2.25; }
    .lini-scope-26060ff6 .lini-arrow { stroke: var(--lini-accent); stroke-width: 2.25; }
    .lini-scope-26060ff6 .lini-marker { fill: var(--lini-stroke); stroke: none; }
  </style>
