<svg xmlns="http://www.w3.org/2000/svg" viewBox="-386.75 -170.25 773.5 340.5" width="773.5" height="340.5" class="lini lini-scope-26060ff6" role="img" aria-labelledby="pattern-carrying-is-not-reading-title pattern-carrying-is-not-reading-desc">
  <title id="pattern-carrying-is-not-reading-title">Two kinds of entry, one trail</title>
  <desc id="pattern-carrying-is-not-reading-desc">On the left, a sealed payload travelling: each hop that carries it leaves a travel entry, which is about the task and answers where this went. On the right, somebody opening it: that leaves an access entry on the document, which answers who read this — or leaves no entry at all, which is the trail saying nobody looked. Beneath, the one read deliberately not recorded: the machinery's own read to seal the payload, which yields only ciphertext and is therefore not a disclosure.</desc>
  <style>
