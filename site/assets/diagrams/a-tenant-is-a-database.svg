    .lini-scope-244a9ef7 .lini-capf { color: var(--lini-faint); }
    .lini-scope-244a9ef7 .lini-eyebrow { color: var(--lini-faint); font-size: 11px; font-weight: bold; }
    .lini-scope-244a9ef7 .lini-panel { fill: var(--lini-panel); stroke: var(--lini-line); stroke-width: 1.5; }
