<svg xmlns="http://www.w3.org/2000/svg" viewBox="-384 -141.25 770.75 282.5" width="770.75" height="282.5" class="lini lini-scope-244a9ef7" role="img" aria-labelledby="a-tenant-is-a-database-title a-tenant-is-a-database-desc">
  <title id="a-tenant-is-a-database-title">One shared table, and a database per tenant</title>
  <desc id="a-tenant-is-a-database-desc">On the left, one table holding rows belonging to three organisations; a query that omits its tenant filter returns all of them. On the right, each organisation has its own database, and the same query returns only that organisation's rows.</desc>
