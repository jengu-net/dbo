      .lini-scope-244a9ef7[data-theme="dark"], [data-theme="dark"] .lini-scope-244a9ef7 { color-scheme: dark; }
      .lini-scope-244a9ef7[data-theme="light"], [data-theme="light"] .lini-scope-244a9ef7 { color-scheme: light; }
    }
