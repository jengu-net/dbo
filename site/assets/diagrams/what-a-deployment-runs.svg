<svg xmlns="http://www.w3.org/2000/svg" viewBox="-552.6345 -262 1213.3944 504.5" width="1213.3944" height="504.5" class="lini lini-scope-57e57582" role="img" aria-labelledby="what-a-deployment-runs-title what-a-deployment-runs-desc">
  <title id="what-a-deployment-runs-title">What a deployment runs, and what it deliberately does not</title>
  <desc id="what-a-deployment-runs-desc">One OSGi container holds the shipped distribution: every bundle that touches tenant data, a face per FHIR version and a runtime per tenant, over PostgreSQL with a database per tenant. Beside it run plain jars, each its own process with its own credentials: the operator that provisions against Kubernetes, the fleet reader that reads a deployment from outside, and the verifier that checks a sealed archive with no network. A development console is drawn apart and dashed because it binds tenant-plane services and is kept out of the serving distribution for that reason.</desc>
  <style>
    @layer lini.defaults {
      :root, .lini-scope-57e57582 { color-scheme: light dark; --lini-accent: #a8641b; --lini-accent-soft: #f6efe4; --lini-bg: #fbfaf8; --lini-caption-color: light-dark(rgba(0, 0, 0, 0.5), rgba(255, 255, 255, 0.55)); --lini-caption-font-weight: 400; --lini-faint: #8695a3; --lini-fg: light-dark(black, #e8e8ea); --lini-fill: light-dark(white, #26262b); --lini-font-weight: 500; --lini-group-fill: light-dark(rgba(0, 0, 0, 0.03), rgba(255, 255, 255, 0.05)); --lini-group-stroke: light-dark(rgba(0, 0, 0, 0.4), rgba(255, 255, 255, 0.4)); --lini-link-font-weight: 400; --lini-seal: #14532d; --lini-seal-soft: #e7f0e9; --lini-stroke: #444444; --lini-text-color: var(--lini-fg); }
      .lini-scope-57e57582[data-theme="dark"], [data-theme="dark"] .lini-scope-57e57582 { color-scheme: dark; }
      .lini-scope-57e57582[data-theme="light"], [data-theme="light"] .lini-scope-57e57582 { color-scheme: light; }
    }
    .lini-scope-57e57582 { font-family: "Google Sans"; font-size: 13px; font-weight: var(--lini-font-weight); color: var(--lini-text-color); }
    .lini-scope-57e57582 .lini-block { fill: none; stroke: none; stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-57e57582 .lini-cyl { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-57e57582 .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-57e57582 .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-57e57582 .lini-group { fill: var(--lini-group-fill); stroke: var(--lini-group-stroke); stroke-width: 1; stroke-dasharray: 5,4; }
    .lini-scope-57e57582 .lini-caption { color: var(--lini-caption-color); font-size: 10.4px; font-weight: var(--lini-caption-font-weight); }
    .lini-scope-57e57582 .lini-served { fill: var(--lini-seal-soft); stroke: var(--lini-seal); }
    .lini-scope-57e57582 .lini-beside { fill: var(--lini-accent-soft); stroke: var(--lini-accent); }
    .lini-scope-57e57582 .lini-unshipped { fill: var(--lini-bg); stroke: var(--lini-faint); stroke-dasharray: 3,2.5; }
    .lini-scope-57e57582 .lini-link { fill: none; stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-57e57582 .lini-link-label { fill: currentColor; stroke: none; text-anchor: middle; font-size: 9.5333px; font-weight: var(--lini-link-font-weight); }
    .lini-scope-57e57582 .lini-cut-bg { fill: white; stroke: none; }
    .lini-scope-57e57582 .lini-cut { fill: black; stroke: none; }
    .lini-scope-57e57582 .lini-marker { fill: var(--lini-stroke); stroke: none; }
