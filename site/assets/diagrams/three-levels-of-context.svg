    .lini-scope-a76fc9d7 .lini-block { fill: none; stroke: none; stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-a76fc9d7 .lini-cyl { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-a76fc9d7 .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
