    .lini-scope-a76fc9d7 .lini-infra { fill: var(--lini-bg); stroke: var(--lini-line); }
    .lini-scope-a76fc9d7 .lini-link { fill: none; stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-a76fc9d7 .lini-link-label { fill: currentColor; stroke: none; text-anchor: middle; font-size: 9.5333px; font-weight: var(--lini-link-font-weight); }
