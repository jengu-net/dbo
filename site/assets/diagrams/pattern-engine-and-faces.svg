<svg xmlns="http://www.w3.org/2000/svg" viewBox="-385.5 -155.75 770.25 311.5" width="770.25" height="311.5" class="lini lini-scope-8f909b3e" role="img" aria-labelledby="pattern-engine-and-faces-title pattern-engine-and-faces-desc">
  <title id="pattern-engine-and-faces-title">Where the domain is, and is not</title>
  <desc id="pattern-engine-and-faces-desc">Three faces across the top: a FHIR R4 face with ids, history, search and operations; a FHIR R5 face using topics instead of criteria; and a sibling model that is not a health standard at all. Beneath them one engine, whose whole vocabulary is record, custody, history, identity, erasure and leaving — not one of which is medical.</desc>
