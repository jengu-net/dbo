<svg xmlns="http://www.w3.org/2000/svg" viewBox="-386.125 -145.125 772.25 290.25" width="772.25" height="290.25" class="lini lini-scope-4ef1b8d1" role="img" aria-labelledby="pattern-one-declared-set-applied-title pattern-one-declared-set-applied-desc">
  <title id="pattern-one-declared-set-applied-title">Written once, applied repeatedly</title>
  <desc id="pattern-one-declared-set-applied-desc">On the left, one declared set held in a repository: value sets and profiles, search parameters, which tenants a deployment serves, and whether a step is automated. On the right, that same set applied as a run whose record is the receipt — to a tenant being brought up for the first time, to one that has been serving for two years, and to an appliance in a building. None of them needed it rewritten.</desc>
