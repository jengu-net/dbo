    .lini-scope-4ef1b8d1 .lini-line { fill: none; stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-4ef1b8d1 .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-4ef1b8d1 .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-4ef1b8d1 .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-4ef1b8d1 .lini-small { color: var(--lini-muted); font-size: 12.5px; }
    .lini-scope-4ef1b8d1 .lini-cap { color: var(--lini-ink); font-weight: 600; }
    .lini-scope-4ef1b8d1 .lini-eyebrow { color: var(--lini-faint); font-size: 11px; font-weight: bold; }
    .lini-scope-4ef1b8d1 .lini-panel { fill: var(--lini-panel); stroke: var(--lini-line); stroke-width: 1.5; }
    .lini-scope-4ef1b8d1 .lini-sealed { fill: var(--lini-seal-soft); stroke: var(--lini-seal); }
    .lini-scope-4ef1b8d1 .lini-line-item { fill: var(--lini-bg); stroke: var(--lini-line); stroke-width: 1.25; }
    .lini-scope-4ef1b8d1 .lini-lt { font-size: 12px; }
    .lini-scope-4ef1b8d1 .lini-has { color: var(--lini-seal); font-weight: 600; }
    .lini-scope-4ef1b8d1 .lini-tile { fill: var(--lini-bg); stroke: var(--lini-line); stroke-width: 1.5; }
    .lini-scope-4ef1b8d1 .lini-rec { fill: var(--lini-panel); stroke: var(--lini-accent); stroke-width: 2; }
    .lini-scope-4ef1b8d1 .lini-solid { fill: var(--lini-seal); stroke: none; }
    .lini-scope-4ef1b8d1 .lini-arrow { stroke: var(--lini-accent); stroke-width: 2.25; }
    .lini-scope-4ef1b8d1 .lini-marker { fill: var(--lini-stroke); stroke: none; }
