<svg xmlns="http://www.w3.org/2000/svg" viewBox="-346.0645 -56.6 692.129 113.2" width="692.129" height="113.2" class="lini lini-scope-bddcce39" role="img" aria-labelledby="a-tenants-life-title a-tenants-life-desc">
  <title id="a-tenants-life-title">A tenant's life, and the three points something can be told about</title>
  <desc id="a-tenants-life-desc">A declaration appears and the tenant is provisioned, then reaches dispatch — its store and feeds exist — then surfaces, where its endpoints are mounted, then serving, after which nothing more changes what it can be asked. Those last three are the points a lifecycle listener is registered against.</desc>
  <style>
    @layer lini.defaults {
      :root, .lini-scope-bddcce39 { color-scheme: light dark; --lini-accent: #a8641b; --lini-accent-soft: #f6efe4; --lini-fg: light-dark(black, #e8e8ea); --lini-fill: light-dark(white, #26262b); --lini-font-weight: 500; --lini-link-font-weight: 400; --lini-seal: #14532d; --lini-seal-soft: #e7f0e9; --lini-stroke: #444444; --lini-text-color: var(--lini-fg); }
      .lini-scope-bddcce39[data-theme="dark"], [data-theme="dark"] .lini-scope-bddcce39 { color-scheme: dark; }
      .lini-scope-bddcce39[data-theme="light"], [data-theme="light"] .lini-scope-bddcce39 { color-scheme: light; }
    }
    .lini-scope-bddcce39 { font-family: "Google Sans"; font-size: 13px; font-weight: var(--lini-font-weight); color: var(--lini-text-color); }
    .lini-scope-bddcce39 .lini-block { fill: none; stroke: none; stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-bddcce39 .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-bddcce39 .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-bddcce39 .lini-point { fill: var(--lini-accent-soft); stroke: var(--lini-accent); }
    .lini-scope-bddcce39 .lini-done { fill: var(--lini-seal-soft); stroke: var(--lini-seal); }
    .lini-scope-bddcce39 .lini-link { fill: none; stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-bddcce39 .lini-marker { fill: var(--lini-stroke); stroke: none; }
  </style>
