<svg xmlns="http://www.w3.org/2000/svg" viewBox="-527.8795 -210.5 1055.759 421" width="1055.759" height="421" class="lini lini-scope-dad65e75" role="img" aria-labelledby="a-record-is-read-at-another-version-title a-record-is-read-at-another-version-desc">
  <title id="a-record-is-read-at-another-version-title">A record is read at a version it was not written under</title>
  <desc id="a-record-is-read-at-another-version-desc">A client of an older FHIR version asks its tenant's face for a record. The face reads the stored bytes, which are exactly what was written and carry the version they were written under, and hands them to the converter chain. If every element has a place in the older version, the client gets the record as that version says it. If one does not, the read is refused and the refusal names the element that did not fit. The stored bytes are never rewritten either way.</desc>
