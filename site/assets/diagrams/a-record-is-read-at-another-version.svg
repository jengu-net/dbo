      .lini-scope-dad65e75[data-theme="dark"], [data-theme="dark"] .lini-scope-dad65e75 { color-scheme: dark; }
      .lini-scope-dad65e75[data-theme="light"], [data-theme="light"] .lini-scope-dad65e75 { color-scheme: light; }
    }
