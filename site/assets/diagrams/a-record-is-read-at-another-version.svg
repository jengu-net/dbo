    .lini-scope-dad65e75 .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-dad65e75 .lini-sequence-tab { font-size: 12px; font-weight: 600; }
    .lini-scope-dad65e75 .lini-sequence-guard { font-size: 11px; font-weight: normal; }
