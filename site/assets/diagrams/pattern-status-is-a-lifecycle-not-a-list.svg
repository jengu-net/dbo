      .lini-scope-9d1bf2db[data-theme="dark"], [data-theme="dark"] .lini-scope-9d1bf2db { color-scheme: dark; }
      .lini-scope-9d1bf2db[data-theme="light"], [data-theme="light"] .lini-scope-9d1bf2db { color-scheme: light; }
    }
    .lini-scope-9d1bf2db { font-family: "Google Sans"; font-size: 15px; font-weight: var(--lini-font-weight); color: var(--lini-body); }
