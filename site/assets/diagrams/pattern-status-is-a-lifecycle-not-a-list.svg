    .lini-scope-9d1bf2db .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-9d1bf2db .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-9d1bf2db .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-9d1bf2db .lini-small { color: var(--lini-muted); font-size: 12.5px; }
