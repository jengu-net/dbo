<svg xmlns="http://www.w3.org/2000/svg" viewBox="-386.125 -136.625 771.625 273.25" width="771.625" height="273.25" class="lini lini-scope-9d1bf2db" role="img" aria-labelledby="pattern-status-is-a-lifecycle-not-a-list-title pattern-status-is-a-lifecycle-not-a-list-desc">
  <title id="pattern-status-is-a-lifecycle-not-a-list-title">The state a list leaves out</title>
  <desc id="pattern-status-is-a-lifecycle-not-a-list-desc">Across the top, the five states a tenant passes through: declared, provisioned, brought up, served, and one day taken away. Beneath, two panels. What a running node reports is the tenants it is serving, and a tenant that never came up is simply absent from that list. What therefore has to be askable is why a particular tenant is not being served, and what it was waiting for when it stopped.</desc>
