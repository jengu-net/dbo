    .lini-scope-9d1bf2db .lini-lt { font-size: 12px; }
    .lini-scope-9d1bf2db .lini-has { color: var(--lini-seal); font-weight: 600; }
    .lini-scope-9d1bf2db .lini-miss { color: var(--lini-faint); }
