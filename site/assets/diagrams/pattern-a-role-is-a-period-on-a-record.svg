      .lini-scope-b1e614f4[data-theme="dark"], [data-theme="dark"] .lini-scope-b1e614f4 { color-scheme: dark; }
      .lini-scope-b1e614f4[data-theme="light"], [data-theme="light"] .lini-scope-b1e614f4 { color-scheme: light; }
    }
    .lini-scope-b1e614f4 { font-family: "Google Sans"; font-size: 15px; font-weight: var(--lini-font-weight); color: var(--lini-body); }
