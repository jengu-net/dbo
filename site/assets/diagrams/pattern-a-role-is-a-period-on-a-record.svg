<svg xmlns="http://www.w3.org/2000/svg" viewBox="-385.5 -168.5 771 337" width="771" height="337" class="lini lini-scope-b1e614f4" role="img" aria-labelledby="pattern-a-role-is-a-period-on-a-record-title pattern-a-role-is-a-period-on-a-record-desc">
  <title id="pattern-a-role-is-a-period-on-a-record-title">One record, read as a grant</title>
  <desc id="pattern-a-role-is-a-period-on-a-record-desc">Two columns. On the left, the usual arrangement: a record saying who works here, a separate directory saying who may log in, and the day somebody who left last year is still in the second one. On the right, one record carrying a period — a nurse, in this department, from March until the end of August — read directly as the grant. Revoking access is ending the period, on a record that already had history.</desc>
