    .lini-scope-b1e614f4 .lini-line-item { fill: var(--lini-bg); stroke: var(--lini-line); stroke-width: 1.25; }
    .lini-scope-b1e614f4 .lini-lt { font-size: 12px; }
    .lini-scope-b1e614f4 .lini-has { color: var(--lini-seal); font-weight: 600; }
    .lini-scope-b1e614f4 .lini-miss { color: var(--lini-faint); }
    .lini-scope-b1e614f4 .lini-body { color: var(--lini-muted); }
