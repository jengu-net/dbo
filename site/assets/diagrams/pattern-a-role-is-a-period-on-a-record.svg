    .lini-scope-b1e614f4 .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-b1e614f4 .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-b1e614f4 .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-b1e614f4 .lini-small { color: var(--lini-muted); font-size: 12.5px; }
