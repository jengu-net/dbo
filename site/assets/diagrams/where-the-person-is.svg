    .lini-scope-8c5adea2 .lini-body { color: var(--lini-muted); }
    .lini-scope-8c5adea2 .lini-across { stroke: var(--lini-accent); stroke-width: 1.75; }
    .lini-scope-8c5adea2 .lini-marker { fill: var(--lini-stroke); stroke: none; }
  </style>
