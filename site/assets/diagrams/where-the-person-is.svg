<svg xmlns="http://www.w3.org/2000/svg" viewBox="-386.25 -187 771.75 374" width="771.75" height="374" class="lini lini-scope-8c5adea2" role="img" aria-labelledby="where-the-person-is-title where-the-person-is-desc">
  <title id="where-the-person-is-title">Inside one tenant's database</title>
  <desc id="where-the-person-is-desc">On the left, the vault: names, national identifiers and contact details, each sealed with a key belonging to that one person. On the right, everything else - records, their history, the runs and the audit trail - where a person appears as a pseudonym and nothing else. Below, what each party can read: a participant sees what its claimed run named and nothing behind it; the operator sees that work ran, how long it took and one word for how it ended, with no name and no payload; an auditor of the tenant sees who acted, on what, when and under which run, as a pseudonym until the vault is consulted. Turning a pseudonym back into a person is a recorded read of the vault.</desc>
