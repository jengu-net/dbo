    .lini-scope-8c5adea2 .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-8c5adea2 .lini-small { color: var(--lini-muted); font-size: 12.5px; }
    .lini-scope-8c5adea2 .lini-cap { color: var(--lini-ink); font-weight: 600; }
