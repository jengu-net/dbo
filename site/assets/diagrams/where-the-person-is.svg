      .lini-scope-8c5adea2[data-theme="dark"], [data-theme="dark"] .lini-scope-8c5adea2 { color-scheme: dark; }
      .lini-scope-8c5adea2[data-theme="light"], [data-theme="light"] .lini-scope-8c5adea2 { color-scheme: light; }
