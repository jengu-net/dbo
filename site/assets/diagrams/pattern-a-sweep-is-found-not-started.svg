<svg xmlns="http://www.w3.org/2000/svg" viewBox="-385.5 -152 771 304" width="771" height="304" class="lini lini-scope-f0535feb" role="img" aria-labelledby="pattern-a-sweep-is-found-not-started-title pattern-a-sweep-is-found-not-started-desc">
  <title id="pattern-a-sweep-is-found-not-started-title">The crash, and the attempt after it</title>
  <desc id="pattern-a-sweep-is-found-not-started-desc">Two columns showing the same interruption twice. On the left, work that is started each time it is asked for: run one is interrupted halfway, run two opens beside it, and there are now two accounts of one erasure. On the right, work that is found if one is already open: run one is interrupted halfway, and asking again resumes the same run, which closes when it finds nothing left to do.</desc>
  <style>
    @layer lini.defaults {
      :root, .lini-scope-f0535feb { color-scheme: light dark; --lini-accent: #a8641b; --lini-bg: #fbfaf8; --lini-body: #2c3a47; --lini-faint: #8695a3; --lini-fill: light-dark(white, #26262b); --lini-font-weight: 500; --lini-ink: #111a24; --lini-line: #e3e0da; --lini-muted: #5d6c7b; --lini-panel: #ffffff; --lini-seal: #14532d; --lini-seal-soft: #e7f0e9; --lini-stroke: #444444; }
      .lini-scope-f0535feb[data-theme="dark"], [data-theme="dark"] .lini-scope-f0535feb { color-scheme: dark; }
      .lini-scope-f0535feb[data-theme="light"], [data-theme="light"] .lini-scope-f0535feb { color-scheme: light; }
    }
    .lini-scope-f0535feb { font-family: "Google Sans"; font-size: 15px; font-weight: var(--lini-font-weight); color: var(--lini-body); }
    .lini-scope-f0535feb .lini-block { fill: none; stroke: none; stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-f0535feb .lini-oval { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-f0535feb .lini-path { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-f0535feb .lini-line { fill: none; stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-f0535feb .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-f0535feb .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-f0535feb .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-f0535feb .lini-small { color: var(--lini-muted); font-size: 12.5px; }
    .lini-scope-f0535feb .lini-cap { color: var(--lini-ink); font-weight: 600; }
    .lini-scope-f0535feb .lini-eyebrow { color: var(--lini-faint); font-size: 11px; font-weight: bold; }
    .lini-scope-f0535feb .lini-panel { fill: var(--lini-panel); stroke: var(--lini-line); stroke-width: 1.5; }
    .lini-scope-f0535feb .lini-sealed { fill: var(--lini-seal-soft); stroke: var(--lini-seal); }
    .lini-scope-f0535feb .lini-dashed { fill: none; stroke: var(--lini-faint); stroke-width: 1.5; stroke-dasharray: 6,4.75; }
    .lini-scope-f0535feb .lini-line-item { fill: var(--lini-bg); stroke: var(--lini-line); stroke-width: 1.25; }
    .lini-scope-f0535feb .lini-lt { font-size: 12px; }
    .lini-scope-f0535feb .lini-has { color: var(--lini-seal); font-weight: 600; }
    .lini-scope-f0535feb .lini-miss { color: var(--lini-faint); }
    .lini-scope-f0535feb .lini-tile { fill: var(--lini-bg); stroke: var(--lini-line); stroke-width: 1.5; }
    .lini-scope-f0535feb .lini-glyph { fill: none; stroke: var(--lini-accent); stroke-width: 2.25; }
    .lini-scope-f0535feb .lini-sdot { fill: var(--lini-seal); stroke: none; }
    .lini-scope-f0535feb .lini-arrow { stroke: var(--lini-accent); stroke-width: 2.25; }
    .lini-scope-f0535feb .lini-marker { fill: var(--lini-stroke); stroke: none; }
  </style>
