<svg xmlns="http://www.w3.org/2000/svg" viewBox="-387.5995 -140.125 775.199 280.25" width="775.199" height="280.25" class="lini lini-scope-0905a1b6" role="img" aria-labelledby="authentication-shared-authorisation-never-title authentication-shared-authorisation-never-desc">
  <title id="authentication-shared-authorisation-never-title">Authentication is shared; authorisation never is</title>
  <desc id="authentication-shared-authorisation-never-desc">A person authenticates once at a national broker. A hub holds a session carrying only a verified identifier and no name. Three tenants each resolve that person in their own records: two grant access through an active role, and the third refuses the same valid identity because no role there is active.</desc>
