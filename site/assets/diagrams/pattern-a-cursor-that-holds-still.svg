      :root, .lini-scope-dbfc4772 { color-scheme: light dark; --lini-accent: #a8641b; --lini-bg: #fbfaf8; --lini-body: #2c3a47; --lini-faint: #8695a3; --lini-fill: light-dark(white, #26262b); --lini-font-weight: 500; --lini-ink: #111a24; --lini-line: #e3e0da; --lini-muted: #5d6c7b; --lini-panel: #ffffff; --lini-seal: #14532d; --lini-seal-soft: #e7f0e9; --lini-stroke: #444444; }
      .lini-scope-dbfc4772[data-theme="dark"], [data-theme="dark"] .lini-scope-dbfc4772 { color-scheme: dark; }
      .lini-scope-dbfc4772[data-theme="light"], [data-theme="light"] .lini-scope-dbfc4772 { color-scheme: light; }
    }
