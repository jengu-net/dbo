<svg xmlns="http://www.w3.org/2000/svg" viewBox="-385.5 -182.5 771 365" width="771" height="365" class="lini lini-scope-dbfc4772" role="img" aria-labelledby="pattern-a-cursor-that-holds-still-title pattern-a-cursor-that-holds-still-desc">
  <title id="pattern-a-cursor-that-holds-still-title">A row arrives while you are paging</title>
  <desc id="pattern-a-cursor-that-holds-still-desc">Two columns showing the same insertion under both schemes. On the left, pages counted from the start: page two is items twenty-one to thirty, a row is inserted above, and page three repeats one the caller already had, so every caller deduplicates forever. On the right, a position that names the last item seen: the same insertion happens and the next page is still the next page.</desc>
