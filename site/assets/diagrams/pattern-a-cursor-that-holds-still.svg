    .lini-scope-dbfc4772 .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-dbfc4772 .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-dbfc4772 .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-dbfc4772 .lini-small { color: var(--lini-muted); font-size: 12.5px; }
