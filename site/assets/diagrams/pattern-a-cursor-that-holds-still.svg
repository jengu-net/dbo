    .lini-scope-dbfc4772 .lini-lt { font-size: 12px; }
    .lini-scope-dbfc4772 .lini-has { color: var(--lini-seal); font-weight: 600; }
    .lini-scope-dbfc4772 .lini-miss { color: var(--lini-faint); }
    .lini-scope-dbfc4772 .lini-body { color: var(--lini-muted); }
