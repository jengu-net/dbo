  <title id="crypto-shredding-title">Erasure destroys the key, not the history</title>
  <desc id="crypto-shredding-desc">Before erasure, a person's key opens three stored versions and an archive already taken. After erasure the key is gone and the same three versions and the same archive remain, byte for byte, and are unreadable.</desc>
