      .lini-scope-16c459e7[data-theme="light"], [data-theme="light"] .lini-scope-16c459e7 { color-scheme: light; }
    }
    .lini-scope-16c459e7 { font-family: "Google Sans"; font-size: 15px; font-weight: var(--lini-font-weight); color: var(--lini-body); }
