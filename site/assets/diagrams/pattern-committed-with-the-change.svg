<svg xmlns="http://www.w3.org/2000/svg" viewBox="-385.5 -181.5 771 363" width="771" height="363" class="lini lini-scope-16c459e7" role="img" aria-labelledby="pattern-committed-with-the-change-title pattern-committed-with-the-change-desc">
  <title id="pattern-committed-with-the-change-title">The window that does not exist</title>
  <desc id="pattern-committed-with-the-change-desc">Two columns. On the left, writing and then publishing: the row is committed, then a gap, then the broker is told or is not. That gap is how consumers end up permanently and subtly behind, not badly enough for anybody to notice. On the right, one transaction carrying both the change and its event, so there is no separate publish step and no interval in which one happened and the other did not.</desc>
