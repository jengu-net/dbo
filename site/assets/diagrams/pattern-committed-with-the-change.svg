    .lini-scope-16c459e7 .lini-line { fill: none; stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-16c459e7 .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-16c459e7 .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-16c459e7 .lini-t { color: var(--lini-body); font-size: 13px; }
