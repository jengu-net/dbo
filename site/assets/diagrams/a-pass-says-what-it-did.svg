  <style>
    @layer lini.defaults {
      :root, .lini-scope-2818f566 { color-scheme: light dark; --lini-accent: #a8641b; --lini-accent-soft: #f6efe4; --lini-bg: #fbfaf8; --lini-body: #2c3a47; --lini-faint: #8695a3; --lini-fill: light-dark(white, #26262b); --lini-font-weight: 500; --lini-ink: #111a24; --lini-line: #e3e0da; --lini-muted: #5d6c7b; --lini-panel: #ffffff; --lini-seal: #14532d; --lini-seal-soft: #e7f0e9; --lini-stroke: #444444; }
      .lini-scope-2818f566[data-theme="dark"], [data-theme="dark"] .lini-scope-2818f566 { color-scheme: dark; }
      .lini-scope-2818f566[data-theme="light"], [data-theme="light"] .lini-scope-2818f566 { color-scheme: light; }
    }
    .lini-scope-2818f566 { font-family: "Google Sans"; font-size: 15px; font-weight: var(--lini-font-weight); color: var(--lini-body); }
    .lini-scope-2818f566 .lini-block { fill: none; stroke: none; stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-2818f566 .lini-line { fill: none; stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-2818f566 .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-2818f566 .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-2818f566 .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-2818f566 .lini-small { color: var(--lini-muted); font-size: 12.5px; }
    .lini-scope-2818f566 .lini-cap { color: var(--lini-ink); font-weight: 600; }
    .lini-scope-2818f566 .lini-eyebrow { color: var(--lini-faint); font-size: 11px; font-weight: bold; }
    .lini-scope-2818f566 .lini-panel { fill: var(--lini-panel); stroke: var(--lini-line); stroke-width: 1.5; }
    .lini-scope-2818f566 .lini-chip { fill: var(--lini-bg); stroke: var(--lini-line); stroke-width: 1.25; color: var(--lini-body); font-size: 12px; }
    .lini-scope-2818f566 .lini-live { fill: var(--lini-accent-soft); stroke: var(--lini-accent); color: var(--lini-accent); font-weight: 600; }
    .lini-scope-2818f566 .lini-ghost { fill: none; color: var(--lini-faint); stroke-dasharray: 3,2.5; }
    .lini-scope-2818f566 .lini-sealed { fill: var(--lini-seal-soft); stroke: var(--lini-seal); color: var(--lini-seal); font-weight: 600; }
    .lini-scope-2818f566 .lini-body { color: var(--lini-muted); }
    .lini-scope-2818f566 .lini-miss { color: var(--lini-faint); }
    .lini-scope-2818f566 .lini-marker { fill: var(--lini-stroke); stroke: none; }
