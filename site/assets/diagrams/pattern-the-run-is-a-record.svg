      .lini-scope-160286e5[data-theme="dark"], [data-theme="dark"] .lini-scope-160286e5 { color-scheme: dark; }
      .lini-scope-160286e5[data-theme="light"], [data-theme="light"] .lini-scope-160286e5 { color-scheme: light; }
    }
