<svg xmlns="http://www.w3.org/2000/svg" viewBox="-385.5 -184.5 771 369" width="771" height="369" class="lini lini-scope-160286e5" role="img" aria-labelledby="pattern-the-run-is-a-record-title pattern-the-run-is-a-record-desc">
  <title id="pattern-the-run-is-a-record-title">The same four lines, paid for twice or not at all</title>
  <desc id="pattern-the-run-is-a-record-desc">Two columns. On the left, work held in a queue of its own: history only if somebody wrote it, an audit trail built separately, an owner modelled again, and the work in flight when the node died. On the right, the same four lines for a run that is an ordinary record: history, an audit trail, an owner, and never having been in flight. Nothing was added to get the right-hand column.</desc>
