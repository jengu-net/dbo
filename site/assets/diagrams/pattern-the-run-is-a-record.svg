    .lini-scope-160286e5 .lini-panel { fill: var(--lini-panel); stroke: var(--lini-line); stroke-width: 1.5; }
    .lini-scope-160286e5 .lini-sealed { fill: var(--lini-seal-soft); stroke: var(--lini-seal); }
