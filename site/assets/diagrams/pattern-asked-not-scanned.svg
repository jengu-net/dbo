    .lini-scope-a36d3503 .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-a36d3503 .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-a36d3503 .lini-small { color: var(--lini-muted); font-size: 12.5px; }
