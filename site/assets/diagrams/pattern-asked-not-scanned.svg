      .lini-scope-a36d3503[data-theme="dark"], [data-theme="dark"] .lini-scope-a36d3503 { color-scheme: dark; }
      .lini-scope-a36d3503[data-theme="light"], [data-theme="light"] .lini-scope-a36d3503 { color-scheme: light; }
    }
    .lini-scope-a36d3503 { font-family: "Google Sans"; font-size: 15px; font-weight: var(--lini-font-weight); color: var(--lini-body); }
