<svg xmlns="http://www.w3.org/2000/svg" viewBox="-385.5 -172.75 771 345.5" width="771" height="345.5" class="lini lini-scope-a36d3503" role="img" aria-labelledby="pattern-asked-not-scanned-title pattern-asked-not-scanned-desc">
  <title id="pattern-asked-not-scanned-title">The answer you cannot check</title>
  <desc id="pattern-asked-not-scanned-desc">At the top, the question asked: entries of a given kind, coded in a given system, where the code is indexed but the system is not. On the left, matching the code and quietly dropping the system: rows come back and they look exactly right, which means a wider question has been answered without the caller being able to tell. On the right, refusing instead, and naming which part is supported and which qualifier is not.</desc>
