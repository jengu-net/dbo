    .lini-scope-eb80aed4 .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-eb80aed4 .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-eb80aed4 .lini-t { color: var(--lini-body); font-size: 13px; }
