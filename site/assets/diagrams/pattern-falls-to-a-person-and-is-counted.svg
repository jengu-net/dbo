<svg xmlns="http://www.w3.org/2000/svg" viewBox="-386.875 -152.5 773.75 305" width="773.75" height="305" class="lini lini-scope-eb80aed4" role="img" aria-labelledby="pattern-falls-to-a-person-and-is-counted-title pattern-falls-to-a-person-and-is-counted-desc">
  <title id="pattern-falls-to-a-person-and-is-counted-title">The queue nobody measures</title>
  <desc id="pattern-falls-to-a-person-and-is-counted-desc">Three panels left to right. Work is offered to whatever is entitled to perform the step. Either an automated runner takes it, or nothing does. When nothing does it falls to a person, and the fall is counted, per step and per zone. That count is the automation backlog stated as a fact rather than as an opinion.</desc>
