<svg xmlns="http://www.w3.org/2000/svg" viewBox="-475.1582 -253 950.3165 506" width="950.3165" height="506" class="lini lini-scope-dad65e75" role="img" aria-labelledby="a-search-is-answered-title a-search-is-answered-desc">
  <title id="a-search-is-answered-title">A search is compiled, then answered or refused</title>
  <desc id="a-search-is-answered-desc">A client asks the tenant's face for a search. The compiler checks every parameter against what the tenant declared. If all are declared it produces an envelope predicate, which the database answers as one indexed query with a page cursor, and the client gets a bundle and a link to the next page. If any parameter is not declared the search is refused by name and the database is never asked, because a silently dropped filter would answer a narrower question while looking like an answer.</desc>
  <style>
    @layer lini.defaults {
      :root, .lini-scope-dad65e75 { color-scheme: light dark; --lini-accent: #a8641b; --lini-accent-soft: #f6efe4; --lini-bg: #fbfaf8; --lini-faint: #8695a3; --lini-fg: light-dark(black, #e8e8ea); --lini-fill: light-dark(white, #26262b); --lini-font-weight: 500; --lini-group-stroke: light-dark(rgba(0, 0, 0, 0.4), rgba(255, 255, 255, 0.4)); --lini-link-font-weight: 400; --lini-seal: #14532d; --lini-seal-soft: #e7f0e9; --lini-stroke: #444444; --lini-text-color: var(--lini-fg); }
      .lini-scope-dad65e75[data-theme="dark"], [data-theme="dark"] .lini-scope-dad65e75 { color-scheme: dark; }
      .lini-scope-dad65e75[data-theme="light"], [data-theme="light"] .lini-scope-dad65e75 { color-scheme: light; }
    }
    .lini-scope-dad65e75 { font-family: "Google Sans"; font-size: 13px; font-weight: var(--lini-font-weight); color: var(--lini-text-color); }
    .lini-scope-dad65e75 .lini-block { fill: none; stroke: none; stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-dad65e75 .lini-cyl { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-dad65e75 .lini-path { stroke-dasharray: none; }
    .lini-scope-dad65e75 .lini-line { fill: none; stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-dad65e75 .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-dad65e75 .lini-sequence-tab { font-size: 12px; font-weight: 600; }
    .lini-scope-dad65e75 .lini-sequence-guard { font-size: 11px; font-weight: normal; }
    .lini-scope-dad65e75 .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-dad65e75 .lini-note { fill: var(--lini-fill); stroke: var(--lini-stroke); }
    .lini-scope-dad65e75 .lini-outside { fill: var(--lini-bg); stroke: var(--lini-faint); }
    .lini-scope-dad65e75 .lini-face { fill: var(--lini-accent-soft); stroke: var(--lini-accent); }
    .lini-scope-dad65e75 .lini-engine { fill: var(--lini-seal-soft); stroke: var(--lini-seal); }
    .lini-scope-dad65e75 .lini-link { fill: none; stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-dad65e75 .lini-link-dashed { stroke-dasharray: 7,5.5; }
    .lini-scope-dad65e75 .lini-sequence-message { fill: currentColor; stroke: none; text-anchor: middle; font-size: 13px; font-weight: normal; }
    .lini-scope-dad65e75 .lini-marker { fill: var(--lini-stroke); stroke: none; }
  </style>
