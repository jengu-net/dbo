<!--
  The layering rule, drawn once.
  Containment is the whole argument: a tenant's chips are drawn INSIDE the
  zone's, so "cannot widen" is a fact about the picture rather than a caption
  on it. The refused broker is outside the boundary for the same reason.
-->
<svg class="dbo-diagram" viewBox="0 0 760 300" role="img"
     aria-labelledby="zn-title zn-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="zn-title">A zone declares the set; a tenant narrows it</title>
  <desc id="zn-desc">A zone declares three identity brokers. Two tenants
  inside it each accept a subset — one accepts two of the three, the other
  accepts one. A fourth broker outside the zone cannot be accepted by
  anyone.</desc>

  <!-- the jurisdiction -->
  <rect class="d-region" x="0" y="22" width="560" height="256" rx="12"/>
  <text class="d-eyebrow" x="16" y="14">ZONE — THE JURISDICTION</text>
  <text class="d-caption" x="16" y="48">declares which brokers exist</text>

  <rect class="d-chip-seal" x="16" y="60" width="106" height="30" rx="7"/>
  <text class="d-chip-text-seal" x="69" y="79">broker A</text>
  <rect class="d-chip-seal" x="132" y="60" width="106" height="30" rx="7"/>
  <text class="d-chip-text-seal" x="185" y="79">broker B</text>
  <rect class="d-chip-seal" x="248" y="60" width="106" height="30" rx="7"/>
  <text class="d-chip-text-seal" x="301" y="79">broker C</text>

  <!-- a tenant that takes two of them -->
  <rect class="d-box" x="16" y="112" width="252" height="148" rx="9"/>
  <text class="d-caption" x="30" y="134">county hospital</text>
  <text class="d-note-small" x="30" y="152">accepts</text>
  <rect class="d-chip-seal" x="30" y="164" width="106" height="30" rx="7"/>
  <text class="d-chip-text-seal" x="83" y="183">broker A</text>
  <rect class="d-chip-seal" x="146" y="164" width="106" height="30" rx="7"/>
  <text class="d-chip-text-seal" x="199" y="183">broker B</text>
  <text class="d-note-small" x="30" y="222">a policy, not a claim that</text>
  <text class="d-note-small" x="30" y="240">the third one does not work</text>

  <!-- a tenant that takes one -->
  <rect class="d-box" x="288" y="112" width="256" height="148" rx="9"/>
  <text class="d-caption" x="302" y="134">private clinic</text>
  <text class="d-note-small" x="302" y="152">accepts</text>
  <rect class="d-chip-seal" x="302" y="164" width="106" height="30" rx="7"/>
  <text class="d-chip-text-seal" x="355" y="183">broker B</text>
  <text class="d-note-small" x="302" y="222">narrower still, and nobody</text>
  <text class="d-note-small" x="302" y="240">else is affected by that</text>

  <!-- what cannot happen -->
  <g transform="translate(596,0)">
    <text class="d-eyebrow" x="0" y="14">OUTSIDE</text>
    <rect class="d-chip-ghost" x="0" y="60" width="106" height="30" rx="7"/>
    <text class="d-chip-text-faint" x="53" y="79">broker D</text>
    <!-- One line, not a cross: the chip has to stay readable, because the
         point is which broker cannot be accepted rather than that something
         has been struck out. -->
    <line class="d-strike-soft" x1="6" y1="88" x2="100" y2="62"/>
    <text class="d-note-small" x="0" y="118">A tenant cannot accept</text>
    <text class="d-note-small" x="0" y="136">what the zone did not</text>
    <text class="d-note-small" x="0" y="154">declare. Widening is an</text>
    <text class="d-note-small" x="0" y="172">act by the party with</text>
    <text class="d-note-small" x="0" y="190">standing; narrowing is</text>
    <text class="d-note-small" x="0" y="208">always available to the</text>
    <text class="d-note-small" x="0" y="226">party underneath.</text>
  </g>
</svg>
