<svg xmlns="http://www.w3.org/2000/svg" viewBox="-389.276 -148.5 778.552 297" width="778.552" height="297" class="lini lini-scope-01662583" role="img" aria-labelledby="where-access-begins-title where-access-begins-desc">
  <title id="where-access-begins-title">Nothing is accessed except by a step</title>
  <desc id="where-access-begins-desc">A step of a process — validating a batch, clearing a consignment — declares who may perform it, drawn as an active role in the tenant's own records. The step reaches only the documents it needs and the ones it may change, and no others; performing it leaves a run recording what it read and changed, when, and on whose authority. All three sit inside one tenant, which is its own database, and the party running the deployment holds the copies without being able to read them.</desc>
  <style>
    @layer lini.defaults {
      :root, .lini-scope-01662583 { color-scheme: light dark; --lini-accent: #a8641b; --lini-bg: #fbfaf8; --lini-body: #2c3a47; --lini-faint: #8695a3; --lini-fill: light-dark(white, #26262b); --lini-font-weight: 500; --lini-ink: #111a24; --lini-line: #e3e0da; --lini-muted: #5d6c7b; --lini-panel: #ffffff; --lini-seal: #14532d; --lini-seal-soft: #e7f0e9; --lini-stroke: #444444; }
      .lini-scope-01662583[data-theme="dark"], [data-theme="dark"] .lini-scope-01662583 { color-scheme: dark; }
      .lini-scope-01662583[data-theme="light"], [data-theme="light"] .lini-scope-01662583 { color-scheme: light; }
    }
    .lini-scope-01662583 { font-family: "Google Sans"; font-size: 15px; font-weight: var(--lini-font-weight); color: var(--lini-body); }
