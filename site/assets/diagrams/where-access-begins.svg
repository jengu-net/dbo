    .lini-scope-01662583 .lini-line { fill: none; stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-01662583 .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-01662583 .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-01662583 .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-01662583 .lini-small { color: var(--lini-muted); font-size: 12.5px; }
    .lini-scope-01662583 .lini-cap { color: var(--lini-ink); font-weight: 600; }
    .lini-scope-01662583 .lini-eyebrow { color: var(--lini-faint); font-size: 11px; font-weight: bold; }
    .lini-scope-01662583 .lini-panel { fill: var(--lini-panel); stroke: var(--lini-line); stroke-width: 1.5; }
    .lini-scope-01662583 .lini-line-item { fill: var(--lini-bg); stroke: var(--lini-line); stroke-width: 1.25; }
    .lini-scope-01662583 .lini-lt { font-size: 12px; }
    .lini-scope-01662583 .lini-seal-item { fill: var(--lini-seal-soft); stroke: var(--lini-seal); }
    .lini-scope-01662583 .lini-slt { color: var(--lini-seal); font-weight: 600; }
    .lini-scope-01662583 .lini-dashed { fill: none; stroke: var(--lini-line); stroke-width: 1.5; stroke-dasharray: 6,4.75; }
    .lini-scope-01662583 .lini-down { stroke: var(--lini-accent); stroke-width: 1.75; }
    .lini-scope-01662583 .lini-across { stroke: var(--lini-accent); stroke-width: 1.75; }
    .lini-scope-01662583 .lini-marker { fill: var(--lini-stroke); stroke: none; }
  </style>
