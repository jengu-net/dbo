    .lini-scope-69365ed8 .lini-note { fill: var(--lini-fill); stroke: var(--lini-stroke); }
    .lini-scope-69365ed8 .lini-outside { fill: var(--lini-bg); stroke: var(--lini-faint); }
    .lini-scope-69365ed8 .lini-face { fill: var(--lini-accent-soft); stroke: var(--lini-accent); }
