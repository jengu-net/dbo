<svg xmlns="http://www.w3.org/2000/svg" viewBox="-441.353 -165.5 882.706 331" width="882.706" height="331" class="lini lini-scope-69365ed8" role="img" aria-labelledby="a-person-signs-in-title a-person-signs-in-desc">
  <title id="a-person-signs-in-title">A person signs in, and the store works out what they may do</title>
  <desc id="a-person-signs-in-desc">A clinician signs in at the tenant's own authority. The authority reads the tenant's records to find the person and a role whose period has not ended, and issues a token naming the capacity it resolved. The clinician then presents that token to the face, which checks what the capacity allows against the same records and answers with that and no more. Revoking access is ending a period on the role record; there is no second user directory to change.</desc>
