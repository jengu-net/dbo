      .lini-scope-69365ed8[data-theme="dark"], [data-theme="dark"] .lini-scope-69365ed8 { color-scheme: dark; }
      .lini-scope-69365ed8[data-theme="light"], [data-theme="light"] .lini-scope-69365ed8 { color-scheme: light; }
    }
    .lini-scope-69365ed8 { font-family: "Google Sans"; font-size: 13px; font-weight: var(--lini-font-weight); color: var(--lini-text-color); }
