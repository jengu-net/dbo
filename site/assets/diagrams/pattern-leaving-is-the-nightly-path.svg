<svg xmlns="http://www.w3.org/2000/svg" viewBox="-385.5 -148 771 296" width="771" height="296" class="lini lini-scope-753a83cc" role="img" aria-labelledby="pattern-leaving-is-the-nightly-path-title pattern-leaving-is-the-nightly-path-desc">
  <title id="pattern-leaving-is-the-nightly-path-title">The exit, rehearsed or not</title>
  <desc id="pattern-leaving-is-the-nightly-path-desc">Two columns. On the left, an export somebody scopes when the relationship ends: first run on the worst possible day, produced by the party being left, and unverifiable against what was actually held. On the right, the archive that already runs every night: backup and departure are the same path, the archive is sealed to the owner's key rather than the host's, and it can be verified without asking anybody.</desc>
  <style>
    @layer lini.defaults {
      :root, .lini-scope-753a83cc { color-scheme: light dark; --lini-accent: #a8641b; --lini-bg: #fbfaf8; --lini-body: #2c3a47; --lini-faint: #8695a3; --lini-fill: light-dark(white, #26262b); --lini-font-weight: 500; --lini-ink: #111a24; --lini-line: #e3e0da; --lini-panel: #ffffff; --lini-seal: #14532d; --lini-seal-soft: #e7f0e9; --lini-stroke: #444444; }
      .lini-scope-753a83cc[data-theme="dark"], [data-theme="dark"] .lini-scope-753a83cc { color-scheme: dark; }
      .lini-scope-753a83cc[data-theme="light"], [data-theme="light"] .lini-scope-753a83cc { color-scheme: light; }
    }
    .lini-scope-753a83cc { font-family: "Google Sans"; font-size: 15px; font-weight: var(--lini-font-weight); color: var(--lini-body); }
    .lini-scope-753a83cc .lini-block { fill: none; stroke: none; stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-753a83cc .lini-oval { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-753a83cc .lini-line { fill: none; stroke: var(--lini-stroke); stroke-width: 2; stroke-dasharray: none; }
    .lini-scope-753a83cc .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-753a83cc .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-753a83cc .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-753a83cc .lini-cap { color: var(--lini-ink); font-weight: 600; }
    .lini-scope-753a83cc .lini-eyebrow { color: var(--lini-faint); font-size: 11px; font-weight: bold; }
    .lini-scope-753a83cc .lini-panel { fill: var(--lini-panel); stroke: var(--lini-line); stroke-width: 1.5; }
    .lini-scope-753a83cc .lini-sealed { fill: var(--lini-seal-soft); stroke: var(--lini-seal); }
    .lini-scope-753a83cc .lini-dashed { fill: none; stroke: var(--lini-faint); stroke-width: 1.5; stroke-dasharray: 6,4.75; }
    .lini-scope-753a83cc .lini-line-item { fill: var(--lini-bg); stroke: var(--lini-line); stroke-width: 1.25; }
    .lini-scope-753a83cc .lini-lt { font-size: 12px; }
    .lini-scope-753a83cc .lini-has { color: var(--lini-seal); font-weight: 600; }
    .lini-scope-753a83cc .lini-miss { color: var(--lini-faint); }
    .lini-scope-753a83cc .lini-tile { fill: var(--lini-bg); stroke: var(--lini-line); stroke-width: 1.5; }
    .lini-scope-753a83cc .lini-rec { fill: var(--lini-panel); stroke: var(--lini-accent); stroke-width: 2; }
    .lini-scope-753a83cc .lini-sdot { fill: var(--lini-seal); stroke: none; }
    .lini-scope-753a83cc .lini-arrow { stroke: var(--lini-accent); stroke-width: 2.25; }
    .lini-scope-753a83cc .lini-marker { fill: var(--lini-stroke); stroke: none; }
  </style>
