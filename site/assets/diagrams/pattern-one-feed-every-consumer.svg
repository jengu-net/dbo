<svg xmlns="http://www.w3.org/2000/svg" viewBox="-384.75 -215.25 769.5 430.5" width="769.5" height="430.5" class="lini lini-scope-5b6655f1" role="img" aria-labelledby="pattern-one-feed-every-consumer-title pattern-one-feed-every-consumer-desc">
  <title id="pattern-one-feed-every-consumer-title">One line, four positions</title>
  <desc id="pattern-one-feed-every-consumer-desc">One ordered, replayable sequence, with four consumers on it: a client paging through results, a subscriber, a dependent copy, and an appliance that is a long way back and is not thereby broken. Each consumer is a name and a position, so progress, lag and replay mean the same thing for all four and how far behind is one question with one answer.</desc>
