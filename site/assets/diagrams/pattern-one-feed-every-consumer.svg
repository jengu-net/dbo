    .lini-scope-5b6655f1 .lini-text { fill: currentColor; stroke: none; text-anchor: middle; }
    .lini-scope-5b6655f1 .lini-box { fill: var(--lini-fill); stroke: var(--lini-stroke); stroke-width: 2; }
    .lini-scope-5b6655f1 .lini-t { color: var(--lini-body); font-size: 13px; }
    .lini-scope-5b6655f1 .lini-small { color: var(--lini-muted); font-size: 12.5px; }
