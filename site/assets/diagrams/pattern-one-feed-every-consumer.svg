      .lini-scope-5b6655f1[data-theme="dark"], [data-theme="dark"] .lini-scope-5b6655f1 { color-scheme: dark; }
      .lini-scope-5b6655f1[data-theme="light"], [data-theme="light"] .lini-scope-5b6655f1 { color-scheme: light; }
    }
    .lini-scope-5b6655f1 { font-family: "Google Sans"; font-size: 15px; font-weight: var(--lini-font-weight); color: var(--lini-body); }
