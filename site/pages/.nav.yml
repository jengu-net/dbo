# The header menu.
#
# Three of these are sections that drill down — Why, Faces, Technical — and
# the plugin expands each from its directory, so adding a page to one is a
# file rather than an edit here. Material shows them across the header when
# there is room and folds them into the drawer when there is not.
#
# Quickstart sits second, before the essays, because the fastest way to find
# out what something is can be to run it — and because that page is the one
# whose commands are executed on every build, so it is the least likely thing
# here to be lying.
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Why: why
  - Faces: faces
  - Technical: technical
  - Documentation: docs
