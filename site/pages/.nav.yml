# The header menu.
#
# Three of these are sections that drill down — Why, Faces, Technical — and
# the plugin expands each from its directory, so adding a page to one is a
# file rather than an edit here. Material shows them across the header when
# there is room and folds them into the drawer when there is not.
#
# Quickstart is inside Technical rather than beside it: running the thing is
# one of the things somebody planning a deployment does, and a header that
# offers it as a peer of the argument puts a command prompt where a reader
# deciding whether to care expects a reason.
nav:
  - Home: index.md
  - Why: why
  - Faces: faces
  - Technical: technical
  - Documentation: docs
