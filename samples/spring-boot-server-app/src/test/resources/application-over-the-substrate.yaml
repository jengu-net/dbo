# The clinic's application, with the lane carried by the store's own substrate.
#
# One word differs from the stories' profile — dbo.test.lane.carrier — and
# everything that follows from it is derived: no base and no credential, a
# substrate URL both halves point at, and an enrolment whose public halves the
# tenant holds against this worker's client record.
dbo:
  test:
    world: ../sample-world
    lane:
      tenant: hogwarts
      carrier: substrate
  worker:
    poll: 500ms
