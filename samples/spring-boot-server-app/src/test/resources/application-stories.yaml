# The deployment every user story walks on.
#
# ONE CONFIGURATION FOR ALL OF THEM. Spring caches a context by its
# configuration, so a story differing in anything here would get a second
# context, which would bring up a second world over the same database. That is
# why this is a profile the story annotation names, and not a file a story
# could add to.
#
# The application is the clinic's own, configured by its own application.yaml
# with the worker's steps embedded — its lanes, and the clients it has each
# tenant issue for them as the tenant comes up. What is here is what a test
# adds to it: the world the harness stands up, and a quicker poll, because a
# story waits on every run it asks for. No lane is named for the harness to
# derive, so the lanes the stories exercise are the ones a reader runs.
dbo:
  test:
    world: ../sample-world
  # What the deployment gave its nodes for the questions an operator asks
  # them: what a node serves and what it carries. A host's configuration, the
  # same as anybody running the store would set.
  framework:
    "[dbo.tenant.ops.token]": stories-ops
  worker:
    poll: 500ms
