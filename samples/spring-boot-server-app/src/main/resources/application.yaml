# What this application tells the store. Everything under `dbo` is the
# wrapper's; everything else is an ordinary Spring Boot application's.
#
# There is no port for the store and no second server: `mount: servlet` puts
# the tenants' doors on this application's own port, inside its filter chain.
dbo:
  mount: servlet
  tenants:
    directory: ../sample-world/tenants
  # The store keeps its own history in a tenant, and that one is named here
  # rather than watched: the loop that retracts undeclared tenants must not be
  # able to retract the thing that records retractions.
  management-spec: ../sample-world/mom.json
  # The clinic's steps, performed here. The worker application's beans arrive
  # in this context, and the lane they are offered work over is this
  # application's own port: the same HTTP a worker in another JVM would use,
  # so the steps cannot tell which of the two they are running in.
  worker:
    identity:
      # Named and versioned, and not defaulted to an artifact id: a run
      # records who performed it, and an executor that cannot be reproduced
      # cannot be held to what it did.
      name: sample-admissions-worker
      version: "1"
    poll: 2s
    # The client each lane signs in with is one the tenant issues, and this
    # application asks it to as the tenant comes up (EnrollingTheWorker). The
    # secret is a sample's: a deployment's comes from wherever it keeps them.
    lanes:
      - tenant: hogwarts
        base: http://127.0.0.1:${server.port:8080}/t/hogwarts/
        token:
          client-id: ${DBO_WORKER_CLIENT_ID:sample-admissions-worker}
          client-secret: ${DBO_WORKER_CLIENT_SECRET:a-sample-secret-for-the-clinics-worker}

spring:
  application:
    name: dbo-sample-server

# A worker that reaches a tenant over the deployment's substrate rather than
# over HTTP, as the tenant is to know it. Empty unless a worker has handed its
# enrolment over: see application-separated.yaml.
clinic:
  enrolment:
    secret: ${DBO_PARTICIPANT_SECRET:a-sample-secret-for-the-clinics-participant}
