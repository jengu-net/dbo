# THE test dials. They live here, not in build.yml, because a value that only
# exists in a workflow can only be run by retyping it — and three commits
# landed on a red main while "the full build is green locally" was true and
# meaningless.
#
# Bounded by the RUNNER CONTAINER, which is the number that actually kills.
# The CI runners are memory-capped containers -- 2500m each at the time of
# writing, set deliberately in the infrastructure that provisions them, so a
# job that overruns dies loudly instead of swapping the host (pageouts once
# turned a 2-minute build into a 22-minute one, with no signal anywhere that
# memory was the reason).
#
# This file used to say "measured against the CI runner VM's 6g-for-
# everything", and that was true of a 6g VM those capped containers
# replaced. The dial did not follow it down, so the test JVM's CEILING alone
# (2560m) exceeded the whole container — and a ceiling is not consumption,
# which is why it only killed when a suite actually reached for it. It did on
# 2026-08-28, in dbo-fhir-element, as exit 137 naming no test at all.
#
# 2g leaves room inside 2500m for the runner agent and the Gradle daemon,
# which share it. The true floor is lower — dbo-fhir-element passes at 700m —
# but the harness needs somewhere above 1200m (below that HAPI dies as a
# null-message HAPI-2330, which is what an OOM looks like through HAPI), and
# a floor can only be measured honestly INSIDE the container: a laptop with
# spare RAM fails these suites on timing long before it fails on heap.
# CI passes NO test flags: it runs ./verify, which reads exactly this file, so
# the workflow and a laptop cannot disagree about what the check is.
#
# Raising either number is opting IN, per invocation:
#   ./gradlew test -PdboTestHeap=4g -PdboTestParallelism=4
# and what actually applied is printed by every test task ("test jvm: ...").
#
# Clearing them is not a way to get "the default": each module still carries
# its own minimum (dbo-fhir-element 4g, the r4/r5 faces 2g) and that is what
# applies with no property set, because Gradle's own default heap dies inside
# HAPI as a null-message HAPI-2330 that names nothing.
dboTestHeap=2g
dboTestParallelism=1
# The daemon shares the container with the test JVM it forks, and was
# unbounded — the one number in that 2500m nobody had said anything about.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m
